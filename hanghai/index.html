<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="数字航海 · Digital Navigation Adventure —— 一款玻璃拟态风格的海洋主题猜数冒险游戏，包含剧情、炼狱、双生、闪电、迷雾、卧底等六大海域模式。"
    />
    <meta name="theme-color" content="#0A0502" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230A0502'/><text x='50' y='68' font-size='64' text-anchor='middle' dominant-baseline='middle'>⚓</text></svg>"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>数字航海 · Digital Navigation Adventure</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 (browser build, no install / no build step) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>

    <!-- Lucide icons (vanilla, replaces <i data-lucide="..."> with SVG) -->
    <script src="https://unpkg.com/lucide@1.30.0/dist/umd/lucide.min.js"></script>

    <!-- Tailwind theme customisation: remap cyan shades to lava-orange accent -->
    <style type="text/tailwindcss">
      @import "tailwindcss";

      @theme {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Georgia", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

        /* Re-mapping cyan utility shades to the high-fidelity lava-orange accent #FF4E00 */
        --color-cyan-50: #fff5f0;
        --color-cyan-100: #ffe8db;
        --color-cyan-200: #ffd1b7;
        --color-cyan-300: #ffaa85;
        --color-cyan-400: #ff7647;
        --color-cyan-500: #ff4e00;
        --color-cyan-600: #e04400;
        --color-cyan-700: #b83400;
        --color-cyan-800: #912700;
        --color-cyan-900: #732000;
        --color-cyan-950: #400f00;

        /* Custom theme vars */
        --color-accent: #ff4e00;
        --color-glass: rgba(255, 255, 255, 0.03);
        --color-glass-border: rgba(255, 255, 255, 0.08);
      }

      @layer utilities {
        .text-shadow-glow {
          text-shadow: 0 0 15px rgba(255, 78, 0, 0.4), 0 0 3px rgba(255, 78, 0, 0.2);
        }
      }
    </style>

    <!-- Plain custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-root" class="relative min-h-screen bg-[#0A0502] text-[#eaf2f8] font-sans flex items-center justify-center p-3 select-none overflow-x-hidden md:p-6">
      <!-- Immersive UI Atmosphere Fixed Background -->
      <div class="atmosphere"></div>

      <!-- Floating global audio indicator -->
      <div class="absolute top-4 right-4 z-40">
        <button
          id="audio-toggle"
          class="p-2 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-cyan-400 active:scale-95 transition-all flex items-center justify-center cursor-pointer shadow-md"
          title="切换音频静音"
        >
          <i data-lucide="volume-2" class="w-4 h-4" id="audio-icon-on"></i>
          <i data-lucide="volume-x" class="w-4 h-4 hidden" id="audio-icon-off"></i>
        </button>
      </div>

      <!-- Main Glassmorphic Card Container -->
      <main id="main-content" class="glass-card-main relative z-10 w-full max-w-lg p-5 md:p-7 rounded-3xl">
        <!-- Views render here -->
      </main>

      <!-- Floating active toasts notification deck -->
      <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[350] flex flex-col gap-2 pointer-events-none w-max max-w-[90vw]"></div>

      <!-- Canvas animation overlay mount -->
      <div id="animation-overlay"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
