<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>谜题上传审核(本地)</title>
<style>
  :root {
    --paper: #f7efdc;
    --paper-2: #efe4c9;
    --card: #fffdf4;
    --ink: #43372a;
    --ink-soft: #75664c;
    --line: #d6c79c;
    --wax-yellow: #ffd166;
    --wax-orange: #f4a261;
    --wax-green: #8fcb9b;
    --wax-red: #ef8178;
    --wax-blue: #8db9dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(rgba(67,55,42,.045) 1px, transparent 1.2px),
      radial-gradient(rgba(67,55,42,.03) 1px, transparent 1.2px);
    background-size: 22px 22px, 34px 34px;
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.7;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 30px 16px 70px; }
  h1 {
    font-size: 30px;
    margin: 0 0 6px;
    transform: rotate(-1deg);
    letter-spacing: 2px;
    position: relative;
    display: inline-block;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 18px 6px 20px 8px;
    padding: 6px 20px;
    box-shadow: 5px 5px 0 rgba(67,55,42,.28);
  }
  h1::before {
    content: "";
    position: absolute;
    top: -13px;
    left: 30%;
    width: 90px;
    height: 26px;
    background: rgba(255,209,102,.6);
    border-left: 2px dashed rgba(67,55,42,.25);
    border-right: 2px dashed rgba(67,55,42,.25);
    transform: rotate(-2deg);
  }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 8px 0 22px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  input[type="password"], input[type="text"], select, textarea {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px 4px 14px 6px / 6px 14px 4px 12px;
    color: var(--ink);
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); border-width: 2.5px; }
  select { cursor: pointer; }
  button {
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    padding: 7px 16px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  button:hover { transform: translate(-1px,-1px) rotate(-.6deg); box-shadow: 4px 4px 0 var(--ink); }
  button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  button.ghost { background: transparent; border-style: dashed; box-shadow: none; }
  button.good { background: var(--wax-green); }
  button.bad { background: var(--wax-red); }
  .msg {
    padding: 9px 14px;
    border-radius: 12px 4px 14px 6px;
    margin: 10px 0;
    font-size: 14px;
    border: 2.5px dashed var(--ink);
  }
  .msg.err { background: #fdecea; color: #a33; border-color: var(--wax-red); }
  .msg.ok { background: #eaf6ec; color: #2f6b3f; border-color: var(--wax-green); }
  .item {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 16px 6px 18px 8px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 3px 3px 0 rgba(67,55,42,.2);
  }
  .item.done-approved { border-color: var(--wax-green); }
  .item.done-rejected { border-color: var(--wax-red); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .who { font-weight: 700; font-size: 15px; }
  .time { color: var(--ink-soft); font-size: 12.5px; }
  .block { margin-bottom: 10px; }
  .label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 700; }
  .text {
    background: var(--paper-2);
    border: 2px solid var(--line);
    border-radius: 10px 3px 12px 5px;
    padding: 9px 12px;
    white-space: pre-wrap;
    font-size: 13.5px;
  }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .actions input { flex: 1; min-width: 120px; }
  .actions select { padding: 6px 8px; }
  .toggle { background: none; border: none; box-shadow: none; color: var(--ink-soft); cursor: pointer; font-size: 12.5px; padding: 0; text-decoration: underline wavy 1.5px var(--wax-orange); }
  .toggle:hover { background: none; transform: none; box-shadow: none; }
  .counts { color: var(--ink-soft); font-size: 13.5px; }
  .counts b { color: var(--ink); }
  .empty { color: var(--ink-soft); padding: 20px; text-align: center; border: 2.5px dashed var(--line); border-radius: 14px 6px 16px 8px; }
  h2 {
    font-size: 20px;
    margin: 26px 0 12px;
    display: inline-block;
    background: var(--wax-yellow);
    border: 2.5px solid var(--ink);
    border-radius: 12px 4px 14px 6px;
    padding: 3px 16px;
    transform: rotate(-1deg);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .login-box { max-width: 380px; }
  .ai-cfg {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 16px 6px 18px 8px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 3px 3px 0 rgba(67,55,42,.2);
  }
  .ai-cfg-title { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 10px; font-weight: 700; }
  .ai-cfg-field { display: block; margin-bottom: 10px; }
  .ai-cfg-field span { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .ai-cfg-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ai-cfg-tip { font-size: 12.5px; color: var(--ink-soft); }

  /* 手绘确认框 */
  .dlg-mask {
    position: fixed; inset: 0; background: rgba(67,55,42,.38);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .dlg-card {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 20px 8px 24px 10px / 10px 22px 6px 18px;
    box-shadow: 7px 7px 0 rgba(67,55,42,.32);
    padding: 26px 24px 18px;
    max-width: 380px; width: 90%;
    position: relative; transform: rotate(-.6deg);
  }
  .dlg-card::before {
    content: ""; position: absolute; top: -13px; left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 90px; height: 26px;
    background: rgba(255,209,102,.6);
    border-left: 2px dashed rgba(67,55,42,.25);
    border-right: 2px dashed rgba(67,55,42,.25);
  }
  .dlg-title { font-size: 19px; margin: 0 0 10px; letter-spacing: 1px; }
  .dlg-msg { font-size: 15px; margin: 0 0 18px; line-height: 1.7; }
  .dlg-btns { display: flex; gap: 10px; justify-content: flex-end; }

  /* 反馈列表 */
  .fb-item {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 16px 6px 18px 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 3px 3px 0 rgba(67,55,42,.2);
  }
  .fb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .fb-title { font-weight: 700; font-size: 15px; }
  .fb-status { font-size: 12px; border: 2px solid var(--ink); border-radius: 8px 2px 10px 4px; padding: 0 8px; margin-left: 8px; font-weight: 700; }
  .fb-status.st-pending { background: var(--wax-yellow); }
  .fb-status.st-adopted { background: var(--wax-green); }
  .fb-status.st-rejected { background: var(--wax-red); }
  .fb-actions { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .fb-content { white-space: pre-wrap; font-size: 14px; background: var(--paper-2); border-radius: 10px 3px 12px 5px; padding: 8px 12px; border: 2px solid var(--line); }
  .fb-meta { color: var(--ink-soft); font-size: 12.5px; margin-top: 6px; }
  .fb-note { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .fb-note input { flex: 1; min-width: 160px; }
  .fb-del { font-size: 12.5px; padding: 3px 10px; }
  .fb-op { font-size: 12.5px; padding: 3px 10px; }
  .fb-op.good { background: var(--wax-green); }
  .fb-op.bad { background: var(--wax-red); }

  /* 分页 */
  .pager { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 12px 0 4px; }
  .pager button { padding: 3px 12px; font-size: 13px; }
  .pager .pager-info { font-size: 13px; color: var(--ink-soft); }
  .pager button.on { background: var(--wax-yellow); }
  .item.sel { border-color: var(--wax-green); background: rgba(143, 203, 155, 0.12); }
  .fb-item.sel { border-color: var(--wax-green); background: rgba(143, 203, 155, 0.12); }
  .row-sel { width: 16px; height: 16px; accent-color: var(--wax-green); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 谜题上传审核</h1>
  <div class="sub">仅本机可见 · 数据来自公网玩家提交 · 审核通过后直接写入本机题库,公网立即生效</div>

  <div id="loginView">
    <div class="login-box">
      <div class="label">管理密码(与题库管理密码相同)</div>
      <input type="password" id="pwd" placeholder="输入管理密码" style="width:100%" />
      <div style="margin-top:10px"><button id="loginBtn">登录</button></div>
      <div id="loginMsg" class="msg" style="display:none"></div>
    </div>
  </div>

  <div id="mainView" style="display:none">
    <div class="bar">
      <span class="counts" id="counts"></span>
      <button class="ghost" id="aiCfgBtn">⚙️ AI 设置</button>
      <button class="ghost" id="refreshBtn">刷新</button>
      <button class="ghost" id="logoutBtn">退出</button>
    </div>
    <div id="aiCfgPanel" class="ai-cfg" style="display:none">
      <div class="ai-cfg-title">AI 标记模型设置(用于"🤖 AI标记"按钮,保存到本机)</div>
      <label class="ai-cfg-field">
        <span>Base URL(OpenAI 兼容,如 https://opencode.ai/zen/go)</span>
        <input type="text" id="cfgBase" placeholder="https://opencode.ai/zen/go" style="width:100%" />
      </label>
      <label class="ai-cfg-field">
        <span>API Key</span>
        <input type="password" id="cfgKey" placeholder="sk-..." style="width:100%" />
      </label>
      <label class="ai-cfg-field">
        <span>模型名(如 deepseek-v4-flash / mimo-v2.5 / glm-5)</span>
        <input type="text" id="cfgModel" placeholder="deepseek-v4-flash" style="width:100%" />
      </label>
      <div class="ai-cfg-btns">
        <button id="aiCfgSave">保存并使用</button>
        <button class="ghost" id="aiCfgReset">恢复默认</button>
        <span class="ai-cfg-tip" id="aiCfgStatus"></span>
      </div>
    </div>
    <div id="msg" class="msg" style="display:none"></div>
    <h2>待审核</h2>
    <div id="pending"></div>
    <h2>已处理</h2>
    <div class="bar">
      <select id="sortField" title="历史记录排序方式">
        <option value="createdAt">按提交时间</option>
        <option value="reviewedAt">按审核时间</option>
        <option value="status">按状态</option>
        <option value="submitter">按提交者</option>
      </select>
      <button class="ghost" id="sortDirBtn">↓ 降序</button>
      <button class="ghost" id="doneSelPageBtn">☑ 全选本页</button>
      <button class="bad" id="doneDelSel" disabled>🗑 删除选中(0)</button>
      <span style="flex:1"></span>
      <span class="counts">每页</span>
      <select id="donePageSize" title="每页显示条数">
        <option value="10">10 条</option>
        <option value="20" selected>20 条</option>
        <option value="50">50 条</option>
        <option value="100">100 条</option>
      </select>
    </div>
    <div id="done"></div>
    <div class="pager" id="donePager"></div>

    <h2>用户反馈</h2>
    <div class="bar">
      <span class="counts" id="fbCounts"></span>
      <button class="ghost" id="fbRefresh">刷新反馈</button>
      <button class="ghost" id="fbSelPageBtn">☑ 全选本页</button>
      <button class="bad" id="fbDelSel" disabled>🗑 删除选中(0)</button>
      <span style="flex:1"></span>
      <span class="counts">每页</span>
      <select id="fbPageSize" title="每页显示条数">
        <option value="10">10 条</option>
        <option value="20" selected>20 条</option>
        <option value="50">50 条</option>
        <option value="100">100 条</option>
      </select>
    </div>
    <div id="feedback"></div>
    <div class="pager" id="fbPager"></div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:3000"; // 游戏后端本机地址(公网后端的数据源)
const TOKEN_KEY = "local-review-admin-token";
const AI_CFG_KEY = "local-review-ai-config";

// 默认 AI 标记配置(本地在页面里填写后存 localStorage,不提交到 git;此处不放真实 key)
const DEFAULT_AI_CFG = {
  baseUrl: "",
  apiKey: "",
  model: "",
};
let aiCfg = { ...DEFAULT_AI_CFG };
try {
  const saved = JSON.parse(localStorage.getItem(AI_CFG_KEY) || "null");
  if (saved && saved.baseUrl && saved.apiKey && saved.model) aiCfg = saved;
} catch { /* 配置损坏时用默认 */ }

// 分类/难度枚举(与后端 server/data.js 一致)
const CATS = [["horror", "恐怖"], ["suspense", "悬疑"], ["warmth", "温情"], ["mind", "脑洞"], ["social", "现实"]];
const DIFFS = [["easy", "简单"], ["medium", "中等"], ["hard", "困难"]];
const catOptions = CATS.map(([v, l]) => '<option value="' + v + '">' + l + "</option>").join("");
const diffOptions = DIFFS.map(([v, l]) => '<option value="' + v + '">' + l + "</option>").join("");
const catLabel = (v) => (CATS.find(([x]) => x === v) || [])[1] || v;
const diffLabel = (v) => (DIFFS.find(([x]) => x === v) || [])[1] || v;

const $ = (id) => document.getElementById(id);
let token = localStorage.getItem(TOKEN_KEY) || "";
let items = [];
let feedbacks = [];
let sortField = "createdAt";
let sortAsc = false;
// 分页与批量选择
let donePage = 1, donePageSize = 20;
let fbPage = 1, fbPageSize = 20;
const doneSel = new Set(); // 已处理记录选中 id
const fbSel = new Set(); // 反馈选中 id

/** 通用分页器:渲染到容器,page 从 1 起 */
function renderPager(container, page, total, pageSize, onChange) {
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const el = $(container);
  if (totalPages <= 1) {
    el.innerHTML = total ? '<span class="pager-info">共 ' + total + " 条</span>" : "";
    return;
  }
  const btn = (txt, p, on, dis) =>
    '<button class="' + (on ? "on" : "") + '"' + (dis ? " disabled" : "") + ' data-p="' + p + '">' + txt + "</button>";
  let html = '<span class="pager-info">共 ' + total + " 条 · 第 " + page + "/" + totalPages + " 页</span>";
  html += btn("‹ 上一页", page - 1, false, page <= 1);
  const from = Math.max(1, page - 2);
  const to = Math.min(totalPages, page + 2);
  for (let p = from; p <= to; p++) html += btn(p, p, p === page, false);
  html += btn("下一页 ›", page + 1, false, page >= totalPages);
  el.innerHTML = html;
  el.querySelectorAll("button[data-p]").forEach((b) =>
    b.addEventListener("click", () => {
      const p = Number(b.dataset.p);
      if (p >= 1 && p <= totalPages) onChange(p);
    })
  );
}

function cmp(a, b) {
  const dir = sortAsc ? 1 : -1;
  if (sortField === "status") return a.status.localeCompare(b.status) * dir;
  if (sortField === "submitter") return String(a.submitter || "").localeCompare(String(b.submitter || ""), "zh") * dir;
  if (sortField === "reviewedAt") return ((a.reviewedAt || a.createdAt) - (b.reviewedAt || b.createdAt)) * dir;
  return (a.createdAt - b.createdAt) * dir;
}

function showMsg(el, text, ok) {
  el.textContent = text;
  el.style.display = text ? "block" : "none";
  el.className = "msg " + (ok ? "ok" : "err");
}

// ---------- 手绘确认框(替代浏览器 confirm) ----------
let dlgCb = null;
function askConfirm(message, cb) {
  dlgCb = cb;
  $("dlgMsg").textContent = message;
  $("dlgMask").style.display = "flex";
}
function closeDlg() {
  $("dlgMask").style.display = "none";
  dlgCb = null;
}
document.body.insertAdjacentHTML(
  "beforeend",
  '<div id="dlgMask" class="dlg-mask" style="display:none"><div class="dlg-card">' +
    '<div class="dlg-title">确认操作</div><div class="dlg-msg" id="dlgMsg"></div>' +
    '<div class="dlg-btns"><button id="dlgCancel">取消</button><button class="bad" id="dlgOk">确认</button></div>' +
    "</div></div>"
);
$("dlgMask").addEventListener("click", (e) => e.target === $("dlgMask") && closeDlg());
$("dlgCancel").addEventListener("click", closeDlg);
$("dlgOk").addEventListener("click", () => {
  const cb = dlgCb;
  closeDlg();
  cb && cb();
});

async function login() {
  const pwd = $("pwd").value;
  if (!pwd) return;
  try {
    const r = await fetch(API + "/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd }),
    });
    const d = await r.json();
    if (!r.ok) return showMsg($("loginMsg"), "❌ " + (d.error || "登录失败"), false);
    token = d.token;
    localStorage.setItem(TOKEN_KEY, token);
    $("pwd").value = "";
    enter();
  } catch (e) {
    showMsg($("loginMsg"), "❌ 无法连接后端 " + API + "(" + e.message + ")", false);
  }
}

async function load() {
  try {
    const r = await fetch(API + "/api/submissions", { headers: { "X-Admin-Token": token } });
    if (r.status === 401) {
      logout();
      showMsg($("loginMsg"), "❌ 登录已失效,请重新输入管理密码", false);
      return;
    }
    if (!r.ok) return showMsg($("msg"), "❌ 加载失败", false);
    items = await r.json();
    render();
  } catch (e) {
    showMsg($("msg"), "❌ 加载失败:" + e.message, false);
  }
}

// ---------- 用户反馈 ----------
let fbAction = null; // { id, action } 当前展开的操作
let fbNoteVal = "";

function fbStatusText(f) {
  if (f.status === "adopted") {
    return "已采纳" + (f.resolution === "fixed" ? "·已修复" : f.resolution === "improved" ? "·已改进" : "");
  }
  if (f.status === "rejected") return "拒绝采纳";
  return "待处理";
}

async function loadFeedback() {
  try {
    const r = await fetch(API + "/api/feedback", { headers: { "X-Admin-Token": token } });
    if (!r.ok) return showMsg($("msg"), "❌ 反馈加载失败", false);
    feedbacks = await r.json();
    renderFeedback();
  } catch (e) {
    showMsg($("msg"), "❌ 反馈加载失败:" + e.message, false);
  }
}

function renderFeedback() {
  const pendingN = feedbacks.filter((f) => f.status === "pending").length;
  $("fbCounts").innerHTML =
    "共 <b>" + feedbacks.length + "</b> 条 · 待处理 <b>" + pendingN + "</b>";
  const box = $("feedback");
  if (!feedbacks.length) {
    box.innerHTML = '<div class="empty">暂无用户反馈</div>';
    renderPager("fbPager", fbPage, 0, fbPageSize, () => {});
    updateFbSelUI();
    return;
  }
  // 分页(新在前)
  const sorted = [...feedbacks].sort((a, b) => b.createdAt - a.createdAt);
  const totalPages = Math.max(1, Math.ceil(sorted.length / fbPageSize));
  if (fbPage > totalPages) fbPage = totalPages;
  const slice = sorted.slice((fbPage - 1) * fbPageSize, fbPage * fbPageSize);
  box.innerHTML = "";
  slice.forEach((f) => {
    const el = document.createElement("div");
    const selected = fbSel.has(f.id);
    el.className = "fb-item" + (selected ? " sel" : "");
    let actions =
      '<button class="bad fb-del" data-del="' + f.id + '">删除</button>';
    if (f.status === "pending") {
      actions =
        '<button class="good fb-op" data-op="approve" data-id="' + f.id + '">采纳</button>' +
        '<button class="bad fb-op" data-op="reject" data-id="' + f.id + '">拒绝采纳</button>' +
        actions;
    } else if (f.status === "adopted") {
      actions =
        '<button class="good fb-op" data-op="resolve-fixed" data-id="' + f.id + '">已修复</button>' +
        '<button class="fb-op" data-op="resolve-improved" data-id="' + f.id + '">已改进</button>' +
        actions;
    }
    let extra = "";
    if (fbAction && fbAction.id === f.id) {
      extra =
        '<div class="fb-note">' +
        '<input id="fbNoteInput" type="text" placeholder="' +
        (fbAction.action === "reject" ? "拒绝原因(必填)" : "给用户的说明(可选)") +
        '" value="' + escapeHtml(fbNoteVal) + '" />' +
        '<button class="good" id="fbNoteOk">确认</button>' +
        '<button id="fbNoteCancel">取消</button></div>';
    }
    el.innerHTML =
      '<div class="fb-head"><span class="fb-title">' +
      '<input type="checkbox" class="row-sel" data-fb="' + f.id + '"' + (selected ? " checked" : "") + ' /> ' +
      (f.title ? escapeHtml(f.title) : "(无标题)") +
      '<span class="fb-status st-' + f.status + '">' + fbStatusText(f) + "</span>" +
      '</span><span class="fb-actions">' + actions + "</span></div>" +
      '<div class="fb-content">' + escapeHtml(f.content) + "</div>" +
      '<div class="fb-meta">' + escapeHtml(f.submitter) + " · " + fmt(f.createdAt) +
      (f.note ? " · 说明:" + escapeHtml(f.note) : "") + "</div>" +
      extra;
    el.querySelector("[data-del]").addEventListener("click", () => removeFeedback(f.id));
    el.querySelector("[data-fb]").addEventListener("change", (e) => {
      if (e.target.checked) fbSel.add(f.id);
      else fbSel.delete(f.id);
      updateFbSelUI();
      el.classList.toggle("sel", e.target.checked);
    });
    el.querySelectorAll("[data-op]").forEach((b) =>
      b.addEventListener("click", () => {
        fbAction = { id: f.id, action: b.dataset.op };
        fbNoteVal = "";
        renderFeedback();
      })
    );
    if (fbAction && fbAction.id === f.id) {
      el.querySelector("#fbNoteOk").addEventListener("click", () => {
        fbNoteVal = (el.querySelector("#fbNoteInput").value || "").trim();
        fbDo(f.id, fbAction.action);
      });
      el.querySelector("#fbNoteCancel").addEventListener("click", () => {
        fbAction = null;
        fbNoteVal = "";
        renderFeedback();
      });
    }
    box.appendChild(el);
  });
  renderPager("fbPager", fbPage, sorted.length, fbPageSize, (p) => {
    fbPage = p;
    renderFeedback();
  });
  updateFbSelUI();
}

// 反馈:选中计数 / 全选本页 / 批量删除
function updateFbSelUI() {
  const btn = $("fbDelSel");
  btn.disabled = fbSel.size === 0;
  btn.textContent = "🗑 删除选中(" + fbSel.size + ")";
  const pageBoxes = document.querySelectorAll("#feedback .row-sel[data-fb]");
  const pageChecked = [...pageBoxes].filter((b) => b.checked).length;
  $("fbSelPageBtn").textContent =
    pageBoxes.length && pageChecked === pageBoxes.length ? "☐ 取消全选" : "☑ 全选本页";
}
$("fbSelPageBtn").addEventListener("click", () => {
  const pageBoxes = [...document.querySelectorAll("#feedback .row-sel[data-fb]")];
  const allChecked = pageBoxes.length > 0 && pageBoxes.every((b) => b.checked);
  pageBoxes.forEach((b) => {
    b.checked = !allChecked;
    const id = Number(b.dataset.fb);
    if (!allChecked) fbSel.add(id);
    else fbSel.delete(id);
  });
  document.querySelectorAll("#feedback .fb-item").forEach((it) => it.classList.toggle("sel", !allChecked));
  updateFbSelUI();
});
$("fbDelSel").addEventListener("click", () => {
  const ids = [...fbSel];
  if (!ids.length) return;
  askConfirm("批量删除选中的 " + ids.length + " 条反馈?此操作不可恢复。", async () => {
    try {
      const results = await Promise.allSettled(
        ids.map((id) =>
          fetch(API + "/api/feedback/" + id, { method: "DELETE", headers: { "X-Admin-Token": token } }),
        ),
      );
      const fail = results.filter((r) => r.status === "rejected" || !r.value.ok).length;
      fbSel.clear();
      showMsg($("msg"), fail ? "✅ 已删除 " + (ids.length - fail) + " 条," + fail + " 条失败" : "✅ 已删除 " + ids.length + " 条反馈", fail === 0);
      loadFeedback();
    } catch (e) {
      showMsg($("msg"), "❌ 删除失败:" + e.message, false);
    }
  });
});
$("fbPageSize").addEventListener("change", (e) => {
  fbPageSize = Number(e.target.value);
  fbPage = 1;
  renderFeedback();
});

// 反馈审核:approve / reject / resolve-fixed / resolve-improved
async function fbDo(id, action) {
  const note = fbNoteVal;
  if (action === "reject" && !note) {
    fbAction = null;
    return showMsg($("msg"), "❌ 拒绝采纳必须填写原因", false);
  }
  const url =
    action === "approve"
      ? "/api/feedback/" + id + "/approve"
      : action === "reject"
        ? "/api/feedback/" + id + "/reject"
        : "/api/feedback/" + id + "/resolve";
  const body =
    action.startsWith("resolve")
      ? { resolution: action.split("-")[1], note }
      : { note };
  try {
    const r = await fetch(API + url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": token },
      body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) {
      logout();
      return showMsg($("loginMsg"), "❌ 登录已失效,请重新输入管理密码", false);
    }
    if (!r.ok) {
      fbAction = null;
      return showMsg($("msg"), "❌ " + (d.error || "操作失败"), false);
    }
    fbAction = null;
    fbNoteVal = "";
    showMsg($("msg"), "✅ 已处理该反馈", true);
    loadFeedback();
  } catch (e) {
    showMsg($("msg"), "❌ 操作失败:" + e.message, false);
  }
}

async function removeFeedback(id) {
  askConfirm("删除这条反馈?此操作不可恢复。", async () => {
    try {
      const r = await fetch(API + "/api/feedback/" + id, {
        method: "DELETE",
        headers: { "X-Admin-Token": token },
      });
      if (r.status === 401) {
        logout();
        return showMsg($("loginMsg"), "❌ 登录已失效,请重新输入管理密码", false);
      }
      if (!r.ok) return showMsg($("msg"), "❌ 删除反馈失败", false);
      showMsg($("msg"), "✅ 已删除该反馈", true);
      loadFeedback();
    } catch (e) {
      showMsg($("msg"), "❌ 删除反馈失败:" + e.message, false);
    }
  });
}

function render() {
  const pending = items.filter((x) => x.status === "pending");
  const done = items.filter((x) => x.status !== "pending").sort(cmp);
  $("counts").innerHTML = "待审核 <b>" + pending.length + "</b> · 已通过 <b>" + done.filter((x) => x.status === "approved").length + "</b> · 已拒绝 <b>" + done.filter((x) => x.status === "rejected").length + "</b>";
  $("pending").innerHTML = pending.length ? "" : '<div class="empty">暂无待审核的申请</div>';
  pending.forEach(renderItem);
  // 已处理:分页
  const totalPages = Math.max(1, Math.ceil(done.length / donePageSize));
  if (donePage > totalPages) donePage = totalPages;
  const slice = done.slice((donePage - 1) * donePageSize, donePage * donePageSize);
  $("done").innerHTML = done.length ? "" : '<div class="empty">暂无已处理记录</div>';
  slice.forEach(renderDone);
  renderPager("donePager", donePage, done.length, donePageSize, (p) => {
    donePage = p;
    render();
  });
  updateDoneSelUI();
}

function fmt(t) {
  if (!t) return "-";
  const d = new Date(t);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function renderItem(s) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML =
    '<div class="head"><span class="who">#' + s.id + " " + (s.title ? "《" + escapeHtml(s.title) + "》" : "(无标题)") + '</span>' +
    '<span class="time">' + escapeHtml(s.submitter) + " · " + fmt(s.createdAt) + "</span></div>" +
    '<div class="block"><div class="label">汤面</div><div class="text">' + escapeHtml(s.surface) + "</div></div>" +
    '<div class="block"><div class="label">汤底 <button class="toggle" data-id="' + s.id + '">展开</button></div><div class="text" id="truth-' + s.id + '" style="display:none">' + escapeHtml(s.truth) + "</div></div>" +
    '<div class="actions">' +
    '<select id="cat-' + s.id + '" title="分类"><option value="">分类(可选)</option>' + catOptions + "</select>" +
    '<select id="diff-' + s.id + '" title="难度"><option value="">难度(可选)</option>' + diffOptions + "</select>" +
    '<button class="ghost" data-ai="' + s.id + '" title="用 AI 自动判断分类与难度">🤖 AI标记</button>' +
    '<input type="text" id="note-' + s.id + '" maxlength="200" placeholder="拒绝原因(可选)" />' +
    '<button class="good" data-act="approve" data-id="' + s.id + '">✓ 通过并上传题库</button>' +
    '<button class="bad" data-act="reject" data-id="' + s.id + '">✗ 拒绝</button></div>';
  el.querySelector(".toggle").addEventListener("click", (e) => {
    const t = $("truth-" + s.id);
    const open = t.style.display !== "none";
    t.style.display = open ? "none" : "block";
    e.target.textContent = open ? "展开" : "隐藏";
  });
  el.querySelectorAll("[data-act]").forEach((btn) =>
    btn.addEventListener("click", () => review(s.id, btn.dataset.act)),
  );
  const aiBtn = el.querySelector("[data-ai]");
  if (aiBtn) aiBtn.addEventListener("click", () => aiTag(s.id));
  $("pending").appendChild(el);
}

function renderDone(s) {
  const el = document.createElement("div");
  const selected = doneSel.has(s.id);
  el.className = "item done-" + s.status + (selected ? " sel" : "");
  el.innerHTML =
    '<div class="head"><span class="who"><input type="checkbox" class="row-sel" data-done="' + s.id + '"' + (selected ? " checked" : "") + ' /> #' + s.id + " " + (s.title ? "《" + escapeHtml(s.title) + "》" : "(无标题)") + '</span>' +
    '<span class="time">' + escapeHtml(s.submitter) + " · " + fmt(s.createdAt) + "</span></div>" +
    '<div class="text">' + escapeHtml(s.surface.slice(0, 150)) + "…</div>" +
    '<div class="time">' + (s.status === "approved" ? "✅ 已通过" : "❌ 已拒绝") +
    (s.note ? " · 原因:" + escapeHtml(s.note) : "") + " · " + fmt(s.reviewedAt) + "</div>" +
    '<div class="actions"><button class="bad" data-del="' + s.id + '">🗑 删除记录</button></div>';
  el.querySelector("[data-del]").addEventListener("click", () => removeSub(s.id));
  el.querySelector("[data-done]").addEventListener("change", (e) => {
    if (e.target.checked) doneSel.add(s.id);
    else doneSel.delete(s.id);
    updateDoneSelUI();
    el.classList.toggle("sel", e.target.checked);
  });
  $("done").appendChild(el);
}

// 已处理:选中计数 / 全选本页 / 批量删除
function updateDoneSelUI() {
  const btn = $("doneDelSel");
  btn.disabled = doneSel.size === 0;
  btn.textContent = "🗑 删除选中(" + doneSel.size + ")";
  // 全选本页按钮状态
  const pageBoxes = document.querySelectorAll("#done .row-sel[data-done]");
  const pageChecked = [...pageBoxes].filter((b) => b.checked).length;
  $("doneSelPageBtn").textContent =
    pageBoxes.length && pageChecked === pageBoxes.length ? "☐ 取消全选" : "☑ 全选本页";
}
$("doneSelPageBtn").addEventListener("click", () => {
  const pageBoxes = [...document.querySelectorAll("#done .row-sel[data-done]")];
  const allChecked = pageBoxes.length > 0 && pageBoxes.every((b) => b.checked);
  pageBoxes.forEach((b) => {
    b.checked = !allChecked;
    const id = Number(b.dataset.done);
    if (!allChecked) doneSel.add(id);
    else doneSel.delete(id);
  });
  document.querySelectorAll("#done .item").forEach((it) => it.classList.toggle("sel", !allChecked));
  updateDoneSelUI();
});
$("doneDelSel").addEventListener("click", () => {
  const ids = [...doneSel];
  if (!ids.length) return;
  askConfirm("批量删除选中的 " + ids.length + " 条审核记录?此操作不可恢复。", async () => {
    try {
      const results = await Promise.allSettled(
        ids.map((id) =>
          fetch(API + "/api/submissions/" + id, { method: "DELETE", headers: { "X-Admin-Token": token } }),
        ),
      );
      const fail = results.filter((r) => r.status === "rejected" || !r.value.ok).length;
      doneSel.clear();
      showMsg($("msg"), fail ? "✅ 已删除 " + (ids.length - fail) + " 条," + fail + " 条失败" : "✅ 已删除 " + ids.length + " 条记录", fail === 0);
      load();
    } catch (e) {
      showMsg($("msg"), "❌ 删除失败:" + e.message, false);
    }
  });
});
$("donePageSize").addEventListener("change", (e) => {
  donePageSize = Number(e.target.value);
  donePage = 1;
  render();
});

async function removeSub(id) {
  askConfirm("删除该审核记录?此操作不可恢复。", async () => {
    try {
      const r = await fetch(API + "/api/submissions/" + id, {
        method: "DELETE",
        headers: { "X-Admin-Token": token },
      });
      if (r.status === 401) {
        logout();
        return showMsg($("loginMsg"), "❌ 登录已失效,请重新输入管理密码", false);
      }
      if (!r.ok) return showMsg($("msg"), "❌ 删除失败", false);
      showMsg($("msg"), "✅ 已删除该记录", true);
      load();
    } catch (e) {
      showMsg($("msg"), "❌ 删除失败:" + e.message, false);
    }
  });
}

/** AI 自动判断分类与难度,回填当前申请的下拉;使用当前 AI 设置(可自定义地址/key/模型) */
async function aiTag(id) {
  const s = items.find((x) => x.id === id);
  if (!s) return;
  const btn = document.querySelector('[data-ai="' + id + '"]');
  if (btn) btn.disabled = true;
  showMsg($("msg"), "🤖 AI 正在分析分类与难度(" + aiCfg.model + ")…", true);
  try {
    const r = await fetch(API + "/api/ai/tag-soup", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": token },
      body: JSON.stringify({ surface: s.surface, truth: s.truth, config: aiCfg }),
    });
    const d = await r.json();
    if (!r.ok) {
      showMsg($("msg"), "❌ " + (d.error || "AI 分类失败"), false);
      return;
    }
    const catEl = $("cat-" + id);
    const diffEl = $("diff-" + id);
    if (catEl && d.category) catEl.value = d.category;
    if (diffEl && d.difficulty) diffEl.value = d.difficulty;
    showMsg($("msg"), "✅ AI 标记:" + catLabel(d.category) + " · " + diffLabel(d.difficulty) + "(可手动调整后通过)", true);
  } catch (e) {
    showMsg($("msg"), "❌ AI 分类失败:" + e.message, false);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function review(id, act) {
  const note = $("note-" + id) ? $("note-" + id).value : "";
  const category = $("cat-" + id) ? $("cat-" + id).value : "";
  const difficulty = $("diff-" + id) ? $("diff-" + id).value : "";
  try {
    const r = await fetch(API + "/api/submissions/" + id + "/" + act, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": token },
      body: JSON.stringify({ note, category, difficulty }),
    });
    const d = await r.json();
    if (!r.ok) return showMsg($("msg"), "❌ " + (d.error || "操作失败"), false);
    showMsg($("msg"), act === "approve" ? "✅ 已通过,谜题已写入题库,公网立即生效" : "已拒绝该申请", true);
    load();
  } catch (e) {
    showMsg($("msg"), "❌ 操作失败:" + e.message, false);
  }
}

function logout() {
  token = "";
  localStorage.removeItem(TOKEN_KEY);
  $("loginView").style.display = "block";
  $("mainView").style.display = "none";
}

function enter() {
  $("loginView").style.display = "none";
  $("mainView").style.display = "block";
  load();
  loadFeedback();
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("loginBtn").addEventListener("click", login);
$("pwd").addEventListener("keydown", (e) => e.key === "Enter" && login());
$("refreshBtn").addEventListener("click", () => { load(); loadFeedback(); });
$("fbRefresh").addEventListener("click", loadFeedback);
$("logoutBtn").addEventListener("click", logout);

// ---------- AI 设置面板 ----------
function fillAiCfg() {
  $("cfgBase").value = aiCfg.baseUrl;
  $("cfgKey").value = aiCfg.apiKey;
  $("cfgModel").value = aiCfg.model;
}
$("aiCfgBtn").addEventListener("click", () => {
  const panel = $("aiCfgPanel");
  const open = panel.style.display !== "none";
  panel.style.display = open ? "none" : "block";
  if (!open) {
    fillAiCfg();
    $("aiCfgStatus").textContent = "当前:" + aiCfg.model;
  }
});
$("aiCfgSave").addEventListener("click", () => {
  const base = $("cfgBase").value.trim().replace(/\/+$/, "");
  const key = $("cfgKey").value.trim();
  const model = $("cfgModel").value.trim();
  if (!/^https?:\/\//.test(base)) return ($("aiCfgStatus").textContent = "❌ Base URL 必须以 http:// 或 https:// 开头");
  if (!key) return ($("aiCfgStatus").textContent = "❌ 请填写 API Key");
  if (!model) return ($("aiCfgStatus").textContent = "❌ 请填写模型名");
  aiCfg = { baseUrl: base, apiKey: key, model };
  try {
    localStorage.setItem(AI_CFG_KEY, JSON.stringify(aiCfg));
  } catch { /* 存储不可用则仅本次生效 */ }
  $("aiCfgStatus").textContent = "✅ 已保存,当前模型:" + model;
  $("aiCfgPanel").style.display = "none";
  showMsg($("msg"), "✅ AI 标记模型已切换为:" + model, true);
});
$("aiCfgReset").addEventListener("click", () => {
  aiCfg = { ...DEFAULT_AI_CFG };
  localStorage.removeItem(AI_CFG_KEY);
  fillAiCfg();
  $("aiCfgStatus").textContent = "已恢复默认:" + DEFAULT_AI_CFG.model;
});
$("sortField").addEventListener("change", (e) => {
  sortField = e.target.value;
  render();
});
$("sortDirBtn").addEventListener("click", () => {
  sortAsc = !sortAsc;
  $("sortDirBtn").textContent = sortAsc ? "↑ 升序" : "↓ 降序";
  render();
});

// 启动:已有 token 则直接进入
if (token) enter();
</script>
