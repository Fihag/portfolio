<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>魔法幸存者 · 怪物增强版</title>
    <style>        :root {
            --cream: #fff6e8;
            --cream-2: #ffe9c7;
            --brown: #5b3416;
            --brown-soft: #93693f;
            --orange: #ff9f43;
            --orange-deep: #f4761a;
            --amber: #ffd166;
            --coral: #ff6b6b;
            --line: #eec89c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #2b1a12;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #game-wrapper {
            position: relative; width: 100vw; height: 100vh;
            max-width: 900px; max-height: 600px; aspect-ratio: 3/2;
            border: 4px solid #5b3416;
            border-radius: 18px; overflow: hidden;
            box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 0 60px rgba(255,140,60,0.18);
            background: #2b1a12;
        }
        @media (max-width: 768px) {
            #game-wrapper { border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; aspect-ratio: auto; }
        }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        /* ===== HUD ===== */
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
        #hud-top {
            position: absolute; top: 10px; left: 12px; right: 12px;
            display: flex; align-items: flex-start; justify-content: space-between;
        }
        .hud-left { display: flex; flex-direction: column; gap: 5px; }
        .hud-bar {
            position: relative; width: 190px; height: 20px;
            border-radius: 12px; overflow: hidden;
            background: #4a2c14;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.12);
        }
        .hud-fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 12px; width: 100%; transition: width 0.15s linear; }
        .hud-hp .hud-fill { background: linear-gradient(180deg, #ff9494, #ff5a5a); }
        .hud-xp { height: 14px; }
        .hud-xp .hud-fill { background: linear-gradient(180deg, #ffd96b, #ffb93c); }
        .hud-text {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.65); letter-spacing: 0.03em;
        }
        .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .hud-stat {
            background: rgba(91,52,22,0.65); border: 2px solid var(--line);
            border-radius: 14px; padding: 3px 12px;
            color: var(--cream); font-size: 13px; font-weight: bold;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }
        #hud-boss {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: min(420px, 58vw); display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .hud-boss-name { color: var(--cream); font-weight: bold; font-size: 13px; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
        .hud-boss-bar { width: 100%; height: 12px; }
        .hud-boss-bar .hud-fill { background: linear-gradient(180deg, #ff7d7d, #d63b3b); }
        #hud-shield {
            height: 6px; border-radius: 4px; display: none;
            background: linear-gradient(90deg, #c86bff, #ff7be0);
            box-shadow: 0 0 8px rgba(200,107,255,0.8);
        }
        #hud-weps {
            position: absolute; left: 12px; bottom: 10px;
            display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
            font-size: 12px; color: var(--cream);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .chip {
            display: inline-block; background: rgba(255,227,194,0.92);
            color: var(--brown); border: 2px solid var(--line);
            border-radius: 12px; padding: 1px 8px; font-size: 11px; font-weight: bold;
            box-shadow: 0 2px 0 rgba(0,0,0,0.18);
        }
        #hud-warning {
            position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
            font-size: 26px; font-weight: bold; color: var(--coral);
            text-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 0 14px rgba(255,107,107,0.5);
            display: none; letter-spacing: 0.04em; white-space: nowrap;
        }
        #hud-hint {
            position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: rgba(255,246,232,0.78); display: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6); white-space: nowrap;
        }

        /* ===== 暂停遮罩 ===== */
        #pause-overlay {
            position: absolute; inset: 0; z-index: 25;
            display: none; align-items: center; justify-content: center;
            background: rgba(43,26,18,0.6);
        }
        .pause-box {
            background: var(--cream); border: 4px solid var(--orange-deep);
            border-radius: 20px; padding: 22px 40px; text-align: center;
            box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 0 40px rgba(255,140,60,0.35);
        }
        .pause-title { font-size: 26px; font-weight: bold; color: var(--brown); margin-bottom: 6px; }
        .pause-sub { font-size: 13px; color: var(--brown-soft); }

        /* ===== 顶部按钮 ===== */
        #ui-buttons {
            position: absolute; top: 74px; right: 10px; z-index: 30;
            display: flex; gap: 6px; pointer-events: all;
        }
        #ui-buttons button {
            width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid var(--line); background: rgba(255,246,232,0.85);
            color: var(--brown); font-size: 16px; line-height: 1; cursor: pointer; padding: 0;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: all 0.15s;
        }
        #ui-buttons button:hover { transform: translateY(-1px) scale(1.05); border-color: var(--orange); }
        #ui-buttons button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

        /* ===== 升级面板 ===== */
        #levelup-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; pointer-events: all; z-index: 20;
            flex-direction: column; align-items: center; gap: 14px;
            background: var(--cream); border: 4px solid var(--orange-deep);
            border-radius: 22px; padding: 22px 20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.22), 0 0 50px rgba(255,140,60,0.45);
            min-width: 320px; max-width: 95vw;
        }
        #levelup-panel h2 {
            color: var(--orange-deep); font-size: 1.5em; text-align: center;
            letter-spacing: 0.05em; margin: 0; text-shadow: 0 2px 0 rgba(255,255,255,0.55);
        }
        #levelup-panel .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        #levelup-panel .card {
            background: linear-gradient(160deg, var(--cream-2), #ffe0b0);
            border: 3px solid var(--orange); border-radius: 16px; padding: 14px 10px;
            cursor: pointer; width: 122px; text-align: center; transition: all 0.18s;
            color: var(--brown); position: relative; overflow: hidden;
            box-shadow: 0 5px 0 rgba(180,90,20,0.35);
        }
        #levelup-panel .card:hover { border-color: var(--orange-deep); transform: translateY(-4px); box-shadow: 0 9px 0 rgba(180,90,20,0.35); }
        #levelup-panel .card:active { transform: translateY(1px) scale(0.97); box-shadow: 0 2px 0 rgba(180,90,20,0.35); }
        #levelup-panel .card .icon { font-size: 2.1em; display: block; margin-bottom: 4px; }
        #levelup-panel .card .name { display: block; font-weight: bold; font-size: 0.92em; margin-bottom: 4px; color: var(--brown); }
        #levelup-panel .card .desc { display: block; font-size: 0.72em; color: var(--brown-soft); line-height: 1.3; }
        #levelup-panel .card .level-tag {
            display: inline-block; background: var(--orange); color: #fff;
            font-size: 0.66em; font-weight: bold; padding: 2px 9px; border-radius: 10px; margin-top: 7px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }
        #levelup-panel .skip-btn {
            background: var(--cream-2); border: 2px dashed var(--brown-soft); color: var(--brown-soft);
            padding: 8px 26px; border-radius: 20px; font-size: 0.9em; cursor: pointer;
            transition: all 0.15s; margin-top: 4px;
        }
        #levelup-panel .skip-btn:hover { border-color: var(--orange-deep); color: var(--orange-deep); }
        #levelup-panel .lv-btns { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 4px; }
        #levelup-panel .lv-btns .skip-btn { margin-top: 0; }
        #levelup-panel .skip-xp { border-style: solid; border-color: var(--orange); color: var(--orange-deep); background: #ffe3b0; font-weight: bold; }
        @media (max-width: 600px) {
            #levelup-panel .card { width: 84px; padding: 8px 4px; }
            #levelup-panel .card .icon { font-size: 1.4em; }
            #levelup-panel .card .name { font-size: 0.72em; }
            #levelup-panel .card .desc { font-size: 0.62em; }
            #levelup-panel h2 { font-size: 1.2em; }
            #levelup-panel { padding: 14px 8px; gap: 8px; min-width: 0; }
        }

        /* ===== Boss掉落面板 ===== */
        #bossdrop-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; pointer-events: all; z-index: 20;
            flex-direction: column; align-items: center; gap: 14px;
            background: var(--cream); border: 4px solid var(--amber);
            border-radius: 22px; padding: 22px 18px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.22), 0 0 50px rgba(255,209,102,0.5);
            min-width: 320px; max-width: 95vw;
        }
        #bossdrop-panel h2 { color: #c07a1a; font-size: 1.4em; text-align: center; letter-spacing: 0.04em; text-shadow: 0 2px 0 rgba(255,255,255,0.55); margin: 0; }
        #bossdrop-panel .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        #bossdrop-panel .card {
            background: linear-gradient(160deg, var(--cream-2), #ffe0b0);
            border: 3px solid var(--amber); border-radius: 16px; padding: 12px 10px;
            cursor: pointer; width: 122px; text-align: center; transition: all 0.18s;
            color: var(--brown); position: relative; overflow: hidden;
            box-shadow: 0 5px 0 rgba(160,105,30,0.35);
        }
        #bossdrop-panel .card:hover { border-color: #e09a1a; transform: translateY(-4px); box-shadow: 0 9px 0 rgba(160,105,30,0.35); }
        #bossdrop-panel .card:active { transform: translateY(1px) scale(0.97); box-shadow: 0 2px 0 rgba(160,105,30,0.35); }
        #bossdrop-panel .card .icon { font-size: 2em; display: block; margin-bottom: 4px; }
        #bossdrop-panel .card .name { display: block; font-weight: bold; font-size: 0.9em; margin-bottom: 4px; color: #c07a1a; }
        #bossdrop-panel .card .desc { display: block; font-size: 0.7em; color: var(--brown-soft); line-height: 1.3; }

        /* ===== 结算界面 ===== */
        #gameover-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; pointer-events: all; z-index: 20;
            flex-direction: column; align-items: center; gap: 14px;
            background: var(--cream); border: 4px solid var(--coral);
            border-radius: 22px; padding: 26px 26px; text-align: center; color: var(--brown);
            box-shadow: 0 10px 0 rgba(0,0,0,0.22), 0 0 50px rgba(255,107,107,0.45);
        }
        #gameover-overlay h2 { color: var(--coral); font-size: 1.9em; margin: 0; text-shadow: 0 2px 0 rgba(255,255,255,0.55); }
        #gameover-overlay .stat { color: var(--brown-soft); font-size: 0.95em; margin: 3px 0; }
        #gameover-overlay .stat strong { color: var(--orange-deep); }
        #gameover-overlay #go-newrecord { color: var(--amber); font-weight: bold; text-shadow: 0 2px 0 rgba(0,0,0,0.15); font-size: 1.1em; }
        #gameover-overlay button {
            padding: 13px 34px; font-size: 1.05em; border: 3px solid var(--brown);
            border-radius: 26px; cursor: pointer; background: linear-gradient(180deg, var(--amber), var(--orange));
            color: #fff; font-weight: bold; letter-spacing: 0.04em; transition: all 0.15s;
            box-shadow: 0 5px 0 #a86a10;
        }
        #gameover-overlay button:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #a86a10; }
        #gameover-overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86a10; }
        #gameover-overlay .go-btns { display: flex; gap: 10px; }
        #gameover-overlay #menu-btn { background: transparent; color: var(--brown-soft); box-shadow: none; border-color: var(--line); }
        #gameover-overlay #menu-btn:hover { color: var(--brown); border-color: var(--orange-deep); background: var(--cream-2); }

        /* ===== 主菜单 ===== */
        #menu-overlay {
            position: absolute; inset: 0; z-index: 40;
            display: none; align-items: center; justify-content: center;
            background: rgba(43,26,18,0.72);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        }
        .menu-box {
            background: var(--cream); border: 5px solid var(--orange-deep);
            border-radius: 26px; padding: 26px 30px; text-align: center;
            box-shadow: 0 12px 0 rgba(0,0,0,0.25), 0 0 60px rgba(255,140,60,0.5);
            width: min(480px, 92vw); max-height: 92vh; overflow-y: auto;
        }
        .menu-logo { font-size: 34px; font-weight: bold; color: var(--orange-deep); letter-spacing: 0.06em; text-shadow: 0 2px 0 rgba(255,255,255,0.6); }
        .menu-sub { font-size: 13px; color: var(--brown-soft); margin-bottom: 14px; }
        .menu-sec { margin-bottom: 12px; }
        .menu-label { font-size: 13px; font-weight: bold; color: var(--brown); margin-bottom: 6px; }
        .menu-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .menu-row button {
            background: var(--cream-2); border: 2px solid var(--line); color: var(--brown);
            border-radius: 12px; padding: 7px 14px; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: all 0.15s; box-shadow: 0 3px 0 rgba(0,0,0,0.15);
        }
        .menu-row button:hover { border-color: var(--orange); transform: translateY(-1px); }
        .menu-row button.active { background: var(--orange); border-color: var(--orange-deep); color: #fff; box-shadow: 0 3px 0 rgba(160,80,10,0.5); }
        .menu-row button .w-ico { display: block; font-size: 20px; line-height: 1; margin-bottom: 3px; }
        .menu-row button .w-ico svg { width: 22px; height: 22px; }
        .menu-best { color: var(--brown-soft); font-size: 13px; margin: 4px 0 12px; }
        .menu-start {
            display: block; width: 100%; padding: 14px 0; font-size: 20px; font-weight: bold;
            border: 3px solid var(--brown); border-radius: 18px; cursor: pointer;
            background: linear-gradient(180deg, var(--amber), var(--orange)); color: #fff;
            letter-spacing: 0.08em; box-shadow: 0 6px 0 #a86a10; transition: all 0.15s;
        }
        .menu-start:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #a86a10; }
        .menu-start:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86a10; }
        .menu-hint { margin-top: 12px; font-size: 12px; color: var(--brown-soft); }
        /* ===== 开源图标 (Lucide, ISC License) ===== */
        .title-ico { display: inline-flex; vertical-align: -3px; margin-right: 6px; }
        .title-ico svg { width: 20px; height: 20px; }
        .btn-ico { display: inline-flex; vertical-align: -3px; margin-right: 6px; }
        .btn-ico svg { width: 16px; height: 16px; }
        .hud-ico { display: inline-flex; vertical-align: -2px; margin-right: 5px; }
        .hud-ico svg { width: 14px; height: 14px; color: var(--amber); }
        #ui-buttons button { display: flex; align-items: center; justify-content: center; }
        #ui-buttons button svg { width: 18px; height: 18px; }
        #dbg-toggle svg { width: 20px; height: 20px; }
        #levelup-panel .card .icon svg { width: 36px; height: 36px; display: block; margin: 0 auto 4px; color: var(--orange-deep); }
        #bossdrop-panel .card .icon svg { width: 36px; height: 36px; display: block; margin: 0 auto 4px; color: #c07a1a; }
        .chip svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }

</style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div id="hud-top">
                <div class="hud-left">
                    <div class="hud-bar hud-hp"><div class="hud-fill" id="hud-hp-fill"></div><span class="hud-text" id="hud-hp-text"></span></div>
                    <div class="hud-bar hud-xp"><div class="hud-fill" id="hud-xp-fill"></div><span class="hud-text" id="hud-xp-text"></span></div>
                </div>
                <div id="hud-boss" style="display:none;">
                    <div class="hud-boss-name" id="hud-boss-name"></div>
                    <div class="hud-bar hud-boss-bar"><div class="hud-fill" id="hud-boss-fill"></div></div>
                    <div id="hud-shield" style="display:none;width:100%;"></div>
                </div>
                <div class="hud-right">
                    <div class="hud-stat"><span class="hud-ico" data-ico="clock"></span><b id="hud-time">0s</b></div>
                    <div class="hud-stat"><span class="hud-ico" data-ico="skull"></span><b id="hud-kills">0</b></div>
                </div>
            </div>
            <div id="hud-weps"></div>
            <div id="hud-warning"></div>
            <div id="hud-hint"></div>
        </div>
        <div id="pause-overlay">
            <div class="pause-box">
                <div class="pause-title"><span class="title-ico" data-ico="pause"></span>已暂停</div>
                <div class="pause-sub">按 P 或点击右上角按钮继续</div>
            </div>
        </div>
        <div id="menu-overlay">
            <div class="menu-box">
                <div class="menu-logo">魔法幸存者</div>
                <div class="menu-sub">怪物增强版 · 肉鸽割草</div>
                <div class="menu-sec">
                    <div class="menu-label">选择难度</div>
                    <div class="menu-row" id="menu-diffs"></div>
                </div>
                <div class="menu-sec">
                    <div class="menu-label">初始武器</div>
                    <div class="menu-row" id="menu-weapons"></div>
                </div>
                <div class="menu-best" id="menu-best"></div>
                <button class="menu-start" id="menu-start">开始游戏</button>
                <div class="menu-hint">WASD 移动 · 自动攻击 · 击杀升级</div>
            </div>
        </div>
        <div id="levelup-panel">
            <h2><span class="title-ico" data-ico="trending-up"></span>升级！选择一项能力</h2>
            <div class="cards" id="levelup-cards"></div>
            <div class="lv-btns">
                <button class="skip-btn" id="skip-upgrade"><span class="btn-ico" data-ico="shuffle"></span>换一批</button>
                <button class="skip-btn skip-xp" id="skip-xp"><span class="btn-ico" data-ico="coins"></span>跳过（+50%经验）</button>
            </div>
            <p style="color:#888;font-size:0.7em;margin:0;">按键盘 1 / 2 / 3 / 4 / 5 快速选择</p>
        </div>
        <div id="bossdrop-panel" style="display:none;">
            <h2><span class="title-ico" data-ico="gift"></span>Boss掉落！选择一件道具</h2>
            <div class="cards" id="bossdrop-cards"></div>
        </div>
        <div id="gameover-overlay">
            <h2><span class="title-ico" data-ico="skull"></span>你倒下了</h2>
            <p class="stat">存活时间：<strong id="go-time">0</strong> 秒</p>
            <p class="stat">击杀敌人：<strong id="go-kills">0</strong></p>
            <p class="stat">最高等级：<strong id="go-level">1</strong></p>
            <p class="stat">总伤害：<strong id="go-damage">0</strong></p>
            <p class="stat">最佳记录：存活 <strong id="go-best-time">0</strong> 秒 · <strong id="go-best-kills">0</strong> 击杀</p>
            <p class="stat" id="go-newrecord" style="display:none;color:#ffd700;font-weight:bold;"><span class="title-ico" data-ico="trophy"></span>新纪录！</p>
            <div class="go-btns">
                <button id="restart-btn"><span class="btn-ico" data-ico="rotate-ccw"></span>再来一局</button>
                <button id="menu-btn">返回主菜单</button>
            </div>
        </div>
        <div id="ui-buttons">
            <button id="btn-pause" title="暂停 (P)" data-ico="pause"></button>
            <button id="btn-mute" title="静音 (M)" data-ico="volume-2"></button>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('game-wrapper');
            const levelupPanel = document.getElementById('levelup-panel');
            const levelupCards = document.getElementById('levelup-cards');
            const skipBtn = document.getElementById('skip-upgrade');
            const skipXpBtn = document.getElementById('skip-xp');
            const gameoverOverlay = document.getElementById('gameover-overlay');
            const bossdropPanel = document.getElementById('bossdrop-panel');
            const bossdropCards = document.getElementById('bossdrop-cards');
            const restartBtn = document.getElementById('restart-btn');
            const hudHpFill = document.getElementById('hud-hp-fill');
            const hudHpText = document.getElementById('hud-hp-text');
            const hudXpFill = document.getElementById('hud-xp-fill');
            const hudXpText = document.getElementById('hud-xp-text');
            const hudTime = document.getElementById('hud-time');
            const hudKills = document.getElementById('hud-kills');

            function initIcons() {
                document.querySelectorAll('[data-ico]').forEach(el => {
                    const svg = ICONS[el.dataset.ico];
                    if (svg) el.innerHTML = svg;
                });
            }
            const goTime = document.getElementById('go-time');
            const goKills = document.getElementById('go-kills');
            const goLevel = document.getElementById('go-level');
            const goDamage = document.getElementById('go-damage');
            const goBestTime = document.getElementById('go-best-time');
            const goBestKills = document.getElementById('go-best-kills');
            const goNewRecord = document.getElementById('go-newrecord');
            const btnPause = document.getElementById('btn-pause');
            const btnMute = document.getElementById('btn-mute');

            let W, H;

            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const nw = rect.width, nh = rect.height;
                if (nw === W && nh === H && canvas.width === nw * dpr && canvas.height === nh * dpr) return;
                W = nw;
                H = nh;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ==================== 输入管理 ====================
            const keys = {};
            let mousePos = { x: W / 2, y: H / 2 };
            let useTouchControl = false;
            let touchActive = false;
            let touchTarget = { x: 0, y: 0 };

            window.addEventListener('keydown', e => { if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return; keys[e.key.toLowerCase()] = true; e.preventDefault(); });
            window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                mousePos.x = e.clientX - rect.left;
                mousePos.y = e.clientY - rect.top;
            });
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                useTouchControl = true;
                touchActive = true;
                const t = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                touchTarget.x = t.clientX - rect.left;
                touchTarget.y = t.clientY - rect.top;
                mousePos.x = touchTarget.x;
                mousePos.y = touchTarget.y;
                if (game.state === 'levelup') handleLevelupTouch(e);
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!touchActive) return;
                const t = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                touchTarget.x = t.clientX - rect.left;
                touchTarget.y = t.clientY - rect.top;
                mousePos.x = touchTarget.x;
                mousePos.y = touchTarget.y;
            }, { passive: false });
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                touchActive = false;
            }, { passive: false });

            window.addEventListener('keydown', function selectHandler(e) {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
                const key = e.key;
                if (game.state === 'levelup') {
                    if (key === '1' || key === '2' || key === '3' || key === '4' || key === '5') {
                        const idx = parseInt(key) - 1;
                        if (game.currentChoices && game.currentChoices[idx] !== undefined) {
                            game.applyUpgrade(game.currentChoices[idx]);
                        }
                    }
                } else if (game.state === 'bossdrop') {
                    if (key === '1' || key === '2' || key === '3') {
                        const idx = parseInt(key) - 1;
                        if (game.bossDropChoices && game.bossDropChoices[idx] !== undefined) {
                            applyBossDrop(game.bossDropChoices[idx]);
                        }
                    }
                }
            });

            function handleLevelupClick(e) {
                if (game.state !== 'levelup') return;
                const rect = canvas.getBoundingClientRect();
                const cx = e.clientX - rect.left;
                const cy = e.clientY - rect.top;
                checkCardHit(cx, cy);
            }

            function handleLevelupTouch(e) {
                if (game.state !== 'levelup') return;
                const t = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const cx = t.clientX - rect.left;
                const cy = t.clientY - rect.top;
                checkCardHit(cx, cy);
            }

            function checkCardHit(cx, cy) {
                const wrapperRect = wrapper.getBoundingClientRect();
                const cardsEl = levelupCards.children;
                for (let i = 0; i < cardsEl.length; i++) {
                    const cardRect = cardsEl[i].getBoundingClientRect();
                    if (cx >= cardRect.left - wrapperRect.left &&
                        cx <= cardRect.right - wrapperRect.left &&
                        cy >= cardRect.top - wrapperRect.top &&
                        cy <= cardRect.bottom - wrapperRect.top) {
                        if (game.currentChoices && game.currentChoices[i] !== undefined) {
                            game.applyUpgrade(game.currentChoices[i]);
                        }
                        return;
                    }
                }
            }

            // ==================== 暂停 / 静音 ====================
            let paused = false;

            function togglePause() {
                if (game.state !== 'playing') return;
                paused = !paused;
                btnPause.innerHTML = paused ? ICONS.play : ICONS.pause;
            }

            btnPause.addEventListener('click', togglePause);
            btnMute.addEventListener('click', () => { btnMute.innerHTML = sound.toggleMute() ? ICONS['volume-x'] : ICONS['volume-2']; });
            window.addEventListener('keydown', (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
                const k = e.key.toLowerCase();
                if (k === 'p' || e.key === 'Escape') togglePause();
                else if (k === 'm') btnMute.innerHTML = sound.toggleMute() ? ICONS['volume-x'] : ICONS['volume-2'];
            });

            // ==================== 工具函数 ====================
            function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function rand(min, max) { return Math.random() * (max - min) + min; }
            function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

            // ==================== 音效系统（Web Audio 合成） ====================
            const sound = (function() {
                let ctx = null;
                let masterGain = null;
                let muted = false;
                const lastPlayed = {};

                function ensureCtx() {
                    if (!ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return null;
                        ctx = new AC();
                        masterGain = ctx.createGain();
                        masterGain.gain.value = 0.75;
                        masterGain.connect(ctx.destination);
                    }
                    if (ctx.state === 'suspended') ctx.resume();
                    return ctx;
                }

                function tone(freq, dur, type, vol, slideTo, delay = 0) {
                    const c = ensureCtx();
                    if (!c || muted || c.state !== 'running') return;
                    const t0 = c.currentTime + delay;
                    const osc = c.createOscillator();
                    const g = c.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t0);
                    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
                    g.gain.setValueAtTime(0.0001, t0);
                    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                    osc.connect(g); g.connect(masterGain);
                    osc.start(t0); osc.stop(t0 + dur + 0.05);
                }

                function noise(dur, vol, freq) {
                    const c = ensureCtx();
                    if (!c || muted || c.state !== 'running') return;
                    const t0 = c.currentTime;
                    const buf = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
                    const src = c.createBufferSource();
                    src.buffer = buf;
                    const filter = c.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = freq;
                    const g = c.createGain();
                    g.gain.setValueAtTime(vol, t0);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                    src.connect(filter); filter.connect(g); g.connect(masterGain);
                    src.start(t0);
                }

                const DEFS = {
                    shoot:      { min: 60,  fn: () => { tone(880, 0.09, 'square', 0.22, 440); tone(1320, 0.06, 'sine', 0.10, 660); } },
                    spirit:     { min: 60,  fn: () => { tone(1100, 0.07, 'sine', 0.12, 700); } },
                    hit:        { min: 70,  fn: () => { noise(0.06, 0.20, 2200); tone(220, 0.06, 'sine', 0.16, 110); } },
                    enemyDie:   { min: 110, fn: () => { noise(0.18, 0.32, 700); tone(330, 0.14, 'triangle', 0.24, 110); } },
                    bossDie:    { min: 0,   fn: () => { noise(0.55, 0.45, 400); tone(120, 0.5, 'sawtooth', 0.32, 40); tone(80, 0.6, 'sine', 0.26, 30); } },
                    playerHit:  { min: 50,  fn: () => { noise(0.14, 0.38, 500); tone(130, 0.16, 'sawtooth', 0.30, 60); } },
                    shield:     { min: 100, fn: () => { tone(700, 0.14, 'sine', 0.22, 1000); } },
                    levelup:    { min: 0,   fn: () => { tone(523, 0.1, 'triangle', 0.28); tone(659, 0.1, 'triangle', 0.28, null, 0.09); tone(784, 0.18, 'triangle', 0.28, null, 0.18); } },
                    bossDrop:   { min: 0,   fn: () => { tone(392, 0.12, 'triangle', 0.28); tone(587, 0.12, 'triangle', 0.28, null, 0.1); tone(784, 0.2, 'triangle', 0.28, null, 0.2); } },
                    explosion:  { min: 140, fn: () => { noise(0.3, 0.38, 400); tone(95, 0.3, 'sine', 0.28, 40); } },
                    lightning:  { min: 60,  fn: () => { noise(0.1, 0.26, 4200); tone(1500, 0.06, 'square', 0.12, 300); } },
                    meteor:     { min: 150, fn: () => { noise(0.4, 0.42, 450); tone(200, 0.32, 'sine', 0.26, 50); } },
                    bossWarn:   { min: 0,   fn: () => { tone(220, 0.4, 'sawtooth', 0.24, 110); } },
                    summon:     { min: 200, fn: () => { tone(300, 0.1, 'triangle', 0.16, 200); tone(180, 0.12, 'sine', 0.14, 120, 0.08); } },
                    acidSpit:   { min: 250, fn: () => { tone(320, 0.15, 'sawtooth', 0.22, 140); noise(0.1, 0.2, 900); } }
                };

                function play(name) {
                    const def = DEFS[name];
                    if (!def) return;
                    const now = performance.now();
                    if (lastPlayed[name] && now - lastPlayed[name] < def.min) return;
                    lastPlayed[name] = now;
                    def.fn();
                }

                function toggleMute() { muted = !muted; return muted; }

                window.addEventListener('pointerdown', ensureCtx, { once: true });
                window.addEventListener('keydown', ensureCtx, { once: true });
                window.addEventListener('touchstart', ensureCtx, { once: true });

                return { play, toggleMute };
            })();

            // ==================== 粒子系统 ====================
            class Particle {
                constructor(x, y, vx, vy, life, color, size = 3) {
                    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                    this.life = life; this.maxLife = life; this.color = color; this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.x += this.vx * dt; this.y += this.vy * dt;
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = this.life / this.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
            let particles = [];
            const MAX_PARTICLES = 200;
            const MAX_ENEMIES = 160;

            function spawnParticles(x, y, count, color, speed = 80, life = 0.4, size = 3) {
                for (let i = 0; i < count; i++) {
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(speed * 0.4, speed);
                    particles.push(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, rand(life * 0.6, life), color, rand(size * 0.5, size)));
                }
                if (particles.length > MAX_PARTICLES) particles = particles.slice(particles.length - MAX_PARTICLES);
            }

            // ==================== 伤害数字 ====================
            class DamageNumber {
                constructor(x, y, value, color = '#fff') {
                    this.x = x; this.y = y; this.value = Math.round(value); this.color = color;
                    this.life = 0.7; this.maxLife = 0.7; this.vy = -60; this.alive = true;
                }
                update(dt) {
                    this.y += this.vy * dt; this.vy *= 0.96; this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = clamp(this.life / this.maxLife, 0, 1);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.font = `bold ${Math.floor(13*(1+(1-alpha)*0.4))}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(this.value.toString(), this.x, this.y);
                    ctx.globalAlpha = 1;
                }
            }
            let damageNumbers = [];
            const MAX_DMG_NUMBERS = 80;

            function spawnDamageNumber(x, y, value, color = '#fff') {
                damageNumbers.push(new DamageNumber(x + rand(-8, 8), y + rand(-6, 6), value, color));
                if (damageNumbers.length > MAX_DMG_NUMBERS) damageNumbers = damageNumbers.slice(damageNumbers.length - MAX_DMG_NUMBERS);
            }

            // ==================== 通用 Buff 计时（Player/Enemy 共用） ====================
            function updateBuffTimers(self, dt) {
                if (!self.buffTimers) return;
                for (let i = self.buffTimers.length - 1; i >= 0; i--) {
                    self.buffTimers[i].remaining -= dt;
                    if (self.buffTimers[i].remaining <= 0) {
                        self.buffTimers[i].onExpire(self);
                        self.buffTimers.splice(i, 1);
                    }
                }
            }

            // ==================== 屏幕震动 ====================
            let screenShake = { intensity: 0, duration: 0, elapsed: 0 };
            function triggerShake(intensity, duration) {
                screenShake.intensity = Math.max(screenShake.intensity, intensity);
                screenShake.duration = Math.max(screenShake.duration, duration);
                screenShake.elapsed = 0;
            }
            function getShakeOffset() {
                if (screenShake.elapsed >= screenShake.duration) return { x: 0, y: 0 };
                const progress = screenShake.elapsed / screenShake.duration;
                const decay = 1 - progress;
                const intensity = screenShake.intensity * decay;
                return { x: rand(-intensity, intensity), y: rand(-intensity, intensity) };
            }

            // ==================== 技能注册表 ====================
            const MAX_LEVEL = 100;
            const DIFFICULTIES = {
                easy:   { name: '简单', diffStart: 1, mult: 0.8, bossTimer: 120, spawnInterval: 1.6, spawnStep: 0.03, spawnMin: 0.40, bossRespawn: 85, playerHp: 150 },
                normal: { name: '普通', diffStart: 1, mult: 1, bossTimer: 90, spawnInterval: 1.3, spawnStep: 0.04, spawnMin: 0.30, bossRespawn: 70, playerHp: 100 },
                hard:   { name: '困难', diffStart: 3, mult: 1.15, bossTimer: 75, spawnInterval: 1.2, spawnStep: 0.045, spawnMin: 0.28, bossRespawn: 65, playerHp: 90 },
                hell:   { name: '地狱', diffStart: 5, mult: 1.30, bossTimer: 60, spawnInterval: 1.1, spawnStep: 0.06, spawnMin: 0.25, bossRespawn: 55, playerHp: 85 }
            };

            // ==================== 玩家类 ====================
            class Player {
                constructor() {
                    this.x = W / 2; this.y = H / 2; this.size = 14;
                    this.speed = 260; this.speedMultiplier = 1;
                    this.hp = 100; this.maxHp = 100;
                    this.hpRegenPercent = 0.012;
                    this.damageReduction = 0; this.flatArmor = 0;
                    this.globalDamageMultiplier = 1;
                    this.globalCooldownMultiplier = 1;
                    this.damageTakenMultiplier = 1; this.killExplode = false; this.killSpeed = false; this.killSpeedStacks = 0; this.killSpeedTimer = 0; this.synergyBladeSpeed = false;
                    this.extraChoices = 0; this.buffTimers = []; this.expMultiplier = 1;
                    this.pickupRange = 70; this.pickupRangeMultiplier = 1;
                    this.level = 1; this.xp = 0; this.xpToNext = 90;
                    this.invincibleTimer = 0; this.flashTimer = 0; this.shieldFlash = 0;

                    this.slowTimer = 0; this.slowAmount = 0;

                        { type: 'magic_missile', level: 1, cooldown: 0, cooldownTime: 0.85, cooldownMultiplier: 1,
                            damage: 21, damageMultiplier: 1, projectileSpeed: 350, extraProjectiles: 0,
                            splashRadius: 28, splashDamagePercent: 0.35 }
                    ];
                }
                getEffectivePickupRange() { return this.pickupRange * this.pickupRangeMultiplier; }
                getEffectiveSpeed() { return this.speed * this.speedMultiplier * (this.slowTimer > 0 ? (1 - this.slowAmount) : 1); }

                takeDamage(amount, sourceType = 'default', ignoreInvincible = false) {
                    if (this.invincibleTimer > 0 && !ignoreInvincible) return;
                    // 灵魂护盾按护盾量吸收伤害
                    if (this.soulShield && this.soulShieldAmount > 0) {
                        const absorbed = Math.min(this.soulShieldAmount, amount);
                        amount -= absorbed;
                        this.soulShieldAmount -= absorbed;
                        if (absorbed > 0) {
                            spawnDamageNumber(this.x, this.y - 15, absorbed, '#88aaff');
                            sound.play('shield');
                            this.shieldFlash = 0.35;
                            spawnParticles(this.x, this.y, 16, '#88aaff', 130, 0.45, 3);
                        }
                        if (amount <= 0) {
                            if (!ignoreInvincible) this.invincibleTimer = 0.15;
                            this.flashTimer = 0.15;
                            return;
                        }
                    }
                    let dmg = amount * (1 - this.damageReduction) * (this.damageTakenMultiplier || 1);
                    dmg = Math.max(1, Math.round(dmg) - this.flatArmor);
                    this.hp -= dmg;
                    if (!ignoreInvincible) this.invincibleTimer = 0.4;
                    this.flashTimer = 0.25;
                    this.revengeTimer = 0.5;
                    spawnDamageNumber(this.x, this.y - 15, dmg, '#ff4444');
                    if (!ignoreInvincible) sound.play('playerHit');
                    if (!ignoreInvincible) triggerShake(5, 0.2);
                    if (this.hp <= 0) {
                        this.hp = 0; game.state = 'gameover';
                        gameoverOverlay.style.display = 'flex';
                        goTime.textContent = Math.floor(game.time);
                        goKills.textContent = game.kills;
                        goLevel.textContent = this.level;
                        goDamage.textContent = Math.floor(game.totalDamageDealt);
                        // 最佳记录（localStorage）
                        let bestT = 0, bestK = 0, isNew = false;
                        try {
                            bestT = parseInt(localStorage.getItem('rogue_best_time') || '0', 10) || 0;
                            bestK = parseInt(localStorage.getItem('rogue_best_kills') || '0', 10) || 0;
                            const t = Math.floor(game.time);
                            if (t > bestT) { localStorage.setItem('rogue_best_time', t); isNew = true; }
                            if (game.kills > bestK) { localStorage.setItem('rogue_best_kills', game.kills); isNew = true; }
                        } catch(e) {}
                        goBestTime.textContent = Math.max(bestT, Math.floor(game.time));
                        goBestKills.textContent = Math.max(bestK, game.kills);
                        goNewRecord.style.display = isNew ? 'block' : 'none';
                        levelupPanel.style.display = 'none';
                        bossdropPanel.style.display = 'none';
                    }
                }

                addDot(damagePerSecond, duration) {
                    this.dotEffects.push({ amount: damagePerSecond, remaining: duration });
                }

                addXp(amount) {
                    this.xp += amount;
                    while (this.xp >= this.xpToNext && game.state === 'playing' && this.level < MAX_LEVEL) {
                        this.xp -= this.xpToNext;
                        this.level++;
                        if (this.level >= MAX_LEVEL) {
                            this.xpToNext = 999999999;
                        } else if (this.level <= 20) {
                            this.xpToNext = Math.floor(this.xpToNext * 1.14 + 3);
                        } else if (this.level <= 40) {
                            this.xpToNext = Math.floor(this.xpToNext * 1.05);
                        } else if (this.level <= 59) {
                            this.xpToNext = Math.floor(this.xpToNext * 1.10 + 2);
                        } else {
                            this.xpToNext = Math.floor(this.xpToNext + 700);
                        }
                        game.state = 'levelup';
                        game.upgradeCount++;
                        try {
                            game.currentChoices = generateUpgradeChoices(this);
                            if (!game.currentChoices.length) {
                                game.state = 'playing';
                            } else {
                                sound.play('levelup');
                                showLevelupPanel(game.currentChoices);
                            }
                        } catch(e) {
                            console.warn('Levelup error:', e);
                            game.state = 'playing';
                        }
                        this.hp = Math.min(this.maxHp, this.hp + 15);
                    }
                }

                update(dt) {
                    let mx = 0, my = 0;
                    if (useTouchControl && touchActive) {
                        const dx = touchTarget.x - this.x, dy = touchTarget.y - this.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 8) { mx = dx / d; my = dy / d; }
                    } else {
                        if (keys['w'] || keys['arrowup']) my -= 1;
                        if (keys['s'] || keys['arrowdown']) my += 1;
                        if (keys['a'] || keys['arrowleft']) mx -= 1;
                        if (keys['d'] || keys['arrowright']) mx += 1;
                    }
                    if (mx !== 0 || my !== 0) { const mag = Math.hypot(mx, my); mx /= mag; my /= mag; }
                    const spd = this.getEffectiveSpeed();
                    this.x += mx * spd * dt; this.y += my * spd * dt;
                    this.x = clamp(this.x, this.size, W - this.size);
                    this.y = clamp(this.y, this.size, H - this.size);
                    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
                    if (this.flashTimer > 0) this.flashTimer -= dt;
                    if (this.slowTimer > 0) this.slowTimer -= dt;
                    if (this.revengeTimer > 0) this.revengeTimer -= dt;
                    if (this.shieldFlash > 0) this.shieldFlash -= dt;
                    if (this.soulShield && this.soulShieldAmount < this.soulShieldMax) {
                        this.soulShieldAmount = Math.min(this.soulShieldMax, this.soulShieldAmount + (this.soulShieldMax / this.soulShieldRegenTime) * dt);
                    }
                    if (this.killSpeedTimer > 0) { this.killSpeedTimer -= dt; if (this.killSpeedTimer <= 0) { this.speedMultiplier = (this.speedMultiplier || 1) - 0.15 * this.killSpeedStacks; this.killSpeedStacks = 0; } }
                    updateBuffTimers(this, dt);
                    if (this.hpRegenPercent > 0 && this.hp < this.maxHp) {
                        this.hp = Math.min(this.maxHp, this.hp + this.hpRegenPercent * this.maxHp * dt);
                    }
                    for (let i = this.dotEffects.length - 1; i >= 0; i--) {
                        const dot = this.dotEffects[i];
                        dot.remaining -= dt;
                        // 整数 tick 累积：满 1 点才结算，避免微量伤害被 max(1) 放大
                        dot.acc = (dot.acc || 0) + dot.amount * dt;
                        while (dot.acc >= 1) {
                            dot.acc -= 1;
                            this.takeDamage(1, 'dot', true);
                        }
                        if (dot.remaining <= 0) this.dotEffects.splice(i, 1);
                    }
                    for (const w of this.weapons) {
                        if (w.cooldown !== undefined && w.cooldown > 0) w.cooldown -= dt;
                        if (w.type === 'orbit_blade' && w.angle !== undefined) w.angle += w.rotationSpeed * dt;
                    }
                }

                getNearestEnemy() {
                    let nearest = null, minDist = Infinity;
                    for (const enemy of game.enemies) { const d = dist(this, enemy); if (d < minDist) { minDist = d; nearest = enemy; } }
                    return nearest;
                }

                draw(ctx) {
                    const glowAlpha = 0.5 + Math.sin(game.time * 4) * 0.2;
                    const grad = ctx.createRadialGradient(this.x, this.y, this.size * 0.5, this.x, this.y, this.size * 2.2);
                    grad.addColorStop(0, 'rgba(100,200,255,0.9)'); grad.addColorStop(0.5, 'rgba(60,140,220,0.4)'); grad.addColorStop(1, 'rgba(20,60,180,0)');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2.2, 0, Math.PI * 2); ctx.fill();
                    const flashOn = this.flashTimer > 0 && Math.floor(this.flashTimer * 30) % 2 === 0;
                    ctx.fillStyle = flashOn ? '#ffffff' : '#88ddff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#ddeeff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.45, 0, Math.PI * 2); ctx.fill();
                    const pr = this.getEffectivePickupRange();
                    // 拾取圈仅在拥有磁力吸引(multiplier>1)时显示，避免与寒霜光环视觉重叠
                    if (this.pickupRangeMultiplier > 1) {
                        ctx.strokeStyle = 'rgba(255,215,100,0.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
                        ctx.beginPath(); ctx.arc(this.x, this.y, pr, 0, Math.PI * 2); ctx.stroke();
                    }
                    ctx.setLineDash([]); ctx.lineWidth = 1;
                    if (this.soulShield) {
                        if (this.soulShieldAmount >= this.soulShieldMax - 0.01) {
                            const pulse = 0.78 + Math.sin(game.time * 6) * 0.14;
                            const rReady = this.size + 8 + pulse * 2;
                            const g = ctx.createRadialGradient(this.x, this.y, this.size, this.x, this.y, rReady);
                            g.addColorStop(0, 'rgba(136,170,255,0)');
                            g.addColorStop(0.82, 'rgba(136,170,255,0.22)');
                            g.addColorStop(1, 'rgba(136,170,255,0)');
                            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, rReady, 0, Math.PI * 2); ctx.fill();
                            ctx.strokeStyle = 'rgba(136,170,255,0.9)'; ctx.lineWidth = 2.5;
                            ctx.beginPath(); ctx.arc(this.x, this.y, rReady, 0, Math.PI * 2); ctx.stroke();
                        } else {
                            const prog = this.soulShieldAmount / this.soulShieldMax;
                            const rC = this.size + 11;
                            ctx.strokeStyle = 'rgba(136,170,255,0.4)'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.arc(this.x, this.y, rC, 0, Math.PI * 2); ctx.stroke();
                            ctx.strokeStyle = 'rgba(136,170,255,0.85)'; ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.arc(this.x, this.y, rC, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog); ctx.stroke();
                        }
                    }
                    if (this.shieldFlash > 0) {
                        const fa = Math.min(1, this.shieldFlash / 0.35);
                        ctx.strokeStyle = `rgba(160,195,255,${fa})`; ctx.lineWidth = 3 * fa + 1;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 9 + (1 - fa) * 16, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            }

            // ==================== 敌人类 ====================
            class Enemy {
                constructor(x, y, typeKey, difficultyBonus = 0) {
                    const def = ENEMY_TYPES[typeKey];
                    this.x = x; this.y = y; this.typeKey = typeKey;
                    const isBoss = def.isBoss || false;
                    // Boss 按共用出场次数成长（复利，封顶7次，第7次全属性+15%血量再+20%），小怪按时间难度成长
                    const N = Math.max(1, game.bossAppearedCount);
                    const k = Math.min(N - 1, 7);
                    const sc = def.scale || null;
                    const step7 = k >= 7 ? 1.15 : 1;
                    const grow = (rate, capK = 6) => rate ? Math.pow(1 + rate, Math.min(k, capK)) * step7 : 1;
                    if (isBoss && sc) {
                        this.hp = Math.floor(def.hp * grow(sc.hpRate) * (k >= 7 ? 1.2 : 1));
                        this.speed = Math.min(def.speed * grow(sc.speedRate, sc.speedCap || 6), def.speed * 1.5);
                        this.damage = Math.floor(def.damage * grow(sc.contactRate));
                    } else {
                        const hpBonus = 1 + difficultyBonus * 0.15;
                        this.hp = Math.floor(def.hp * hpBonus);
                        this.hp = Math.min(this.hp, Math.floor(def.hp * 11));
                        let rawSpeed = def.speed * (1 + difficultyBonus * 0.15);
                        this.speed = Math.min(rawSpeed, def.speed * 1.8);
                        const dmgBonus = 1 + difficultyBonus * 0.10;
                        this.damage = Math.floor(def.damage * dmgBonus);
                        this.damage = Math.min(this.damage, Math.floor(def.damage * 2.3));
                    }
                    this.maxHp = this.hp;
                    this.size = def.size; this.color = def.color;
                    this.xpValue = Math.floor(def.xpValue * (1 + difficultyBonus * 0.15));
                    this.shape = def.shape;
                    this.slowAmount = 0; this.slowTimer = 0; this.flashTimer = 0;
                    this.alive = true; this.orbitHitCd = 0; this.freezeTimer = 0;
                    this.isRanged = def.isRanged || false;
                    this.isGhost = def.isGhost || false;
                    this.isBoss = isBoss;
                    this.fireballTimer = this.isRanged ? rand(0, def.fireballCooldown) : 0;
                    this.fireballCooldown = def.fireballCooldown || 0;
                    this.fireballDamage = def.fireballDamage || 0;
                    this.fireballSpeed = def.fireballSpeed || 0;
                    this.attackRange = def.attackRange || 0;
                    this.dotDamage = def.dotDamage || 0;
                    this.dotDuration = def.dotDuration || 0;
                    if (this.isBoss) {
                        this.slashCooldown = def.slashCooldown;
                        this.slashTimer = this.slashCooldown;
                        this.slashDamage = Math.floor(def.slashDamage * grow(sc.slashRate));
                        this.slashSpeed = def.slashSpeed;
                        this.chargeTime = def.chargeTime;
                        this.charging = false;
                        this.chargeProgress = 0;
                        this.shieldBase = def.shieldBase || 0;
                        this.shieldHp = 0;
                        this.shieldMax = 0;
                        this.shieldTimer = 0;
                        this.shieldActivated = false;
                        this.shieldThresholds = [0.5, 0.25];
                        this.shieldRecharge = 0;
                        this.stunTimer = 0;
                        this.invincible = false;
                        // ===== Boss 百分比减伤（死神骑士成长型 / 母皇固定，出场3次后+5%） =====
                        if (this.typeKey === 'boss') {
                            this.damageReduction = Math.min(0.50, 0.25 + 0.04 * (game.bossAppearedCount - 1));
                        } else if (this.typeKey === 'broodmother') {
                            this.damageReduction = game.bossAppearedCount >= 3 ? 0.20 : 0.15;
                        } else if (this.typeKey === 'assassin') {
                            this.damageReduction = 0.35;
                        } else {
                            this.damageReduction = 0;
                        }
                        this.auraColor = def.auraColor || 'rgba(80,0,80,0.6)';
                        // ===== 召唤技能（虫巢母皇，无数量上限） =====
                        this.summonType = def.summonType || null;
                        this.summonInterval = def.summonInterval || 0;
                        this.summonCount = def.summonCount || 0;
                        this.summonTimer = this.summonType ? 2 : 0;
                        // ===== 毒液喷射（虫巢母皇，伤害随出场次数成长） =====
                        this.acidCooldown = 4;
                        this.acidTimer = rand(1, 2.5);
                        this.acidDamage = Math.floor(14 * grow(sc.acidRate));
                        this.acidSpeed = 180;
                        this.acidRange = 320;
                        // ===== 冲击波技能 =====
                        this.shockwaveTimer = 5;
                        this.shockwaveInterval = 8;
                        this.shockwaveActive = false;
                        this.shockwaveRadius = 0;
                        this.shockwaveMaxRadius = 200;
                        this.shockwaveSpeed = 260;
                        this.shockwaveInnerSafe = 40;
                        this.shockwaveDamage = Math.floor((def.shockwaveDamage || 18) * grow(sc.shockwaveRate));
                        this.shockwaveHit = false;
                        // ===== 瞬影突进（暗影刺客） =====
                        this.teleportTimer = 4;
                        this.teleportInterval = 4;
                        this.teleporting = false;
                        this.teleportProgress = 0;
                        // ===== 影刃回旋（暗影刺客） =====
                        this.shurikenDamage = Math.floor((def.shurikenDamage || 16) * grow(sc.slashRate));
                        this.shurikenSpeed = def.shurikenSpeed || 240;
                        this.shurikenCount = def.shurikenCount || 6;
                        this.shurikenInterval = def.shurikenInterval || 7;
                        this.shurikenTimer = 3;
                    }
                    // ===== 难度倍率 =====
                    const dm = game.diffMult || 1;
                    this.hp = Math.floor(this.hp * dm);
                    this.maxHp = this.hp;
                    this.damage = Math.floor(this.damage * dm);
                    if (this.fireballDamage) this.fireballDamage = Math.floor(this.fireballDamage * dm);
                    if (this.slashDamage) this.slashDamage = Math.floor(this.slashDamage * dm);
                    if (this.acidDamage) this.acidDamage = Math.floor(this.acidDamage * dm);
                    if (this.shockwaveDamage) this.shockwaveDamage = Math.floor(this.shockwaveDamage * dm);
                    if (this.shieldBase) this.shieldBase = Math.floor(this.shieldBase * dm);
                }

                getEffectiveSpeed() { return this.slowTimer > 0 ? this.speed * (1 - this.slowAmount) : this.speed; }

                takeDamage(amount, sourceType = 'default') {
                    // ===== 护盾吸收 =====
                    if (this.isBoss && this.invincible) {
                        if (this.shieldHp > 0) {
                            const absorbed = Math.min(this.shieldHp, amount);
                            this.shieldHp -= absorbed;
                            amount -= absorbed;
                            spawnDamageNumber(this.x, this.y - this.size, absorbed, '#ffaa00');
                        }
                        if (amount <= 0) return;
                    }

                    // ===== Boss 百分比减伤 =====
                    if (this.isBoss && this.damageReduction) {
                        amount = amount * (1 - this.damageReduction);
                        amount = Math.max(1, Math.floor(amount));
                    }

                    // ===== 扣血 =====
                    this.hp -= amount;
                    this.flashTimer = 0.08;
                    game.totalDamageDealt += amount;
                    spawnDamageNumber(this.x, this.y - this.size, amount, sourceType === 'frost' ? '#aaddff' : '#ffffff');
                    if (this.hp <= 0) {
                        this.alive = false; game.kills++; game.score += this.xpValue;
                        sound.play(this.isBoss ? 'bossDie' : 'enemyDie');
                        // 怨灵死亡：清除其 DoT 效果
                        if (this.isGhost && game.player) {
                            game.player.dotEffects = game.player.dotEffects.filter(d => d.source !== this);
                        }
                        // 击杀加速
                        if (game.player && game.player.killSpeed) {
                            if ((game.player.killSpeedStacks || 0) < 2) {
                                game.player.killSpeedStacks = (game.player.killSpeedStacks || 0) + 1;
                                game.player.speedMultiplier = (game.player.speedMultiplier || 1) + 0.15;
                            }
                            game.player.killSpeedTimer = 2;
                        }
                        // 击杀爆炸
                        if (game.player && game.player.killExplode) {
                            const explodeDmg = this.maxHp * 0.15;
                            sound.play('explosion');
                            const explodeRadius = 60;
                            for (const e of game.enemies) {
                                if (!e.alive || e === this) continue;
                                if (Math.hypot(e.x - this.x, e.y - this.y) < explodeRadius) {
                                    e.takeDamage(explodeDmg, 'explosion');
                                }
                            }
                            spawnParticles(this.x, this.y, 15, '#ff8844', 80, 0.4, 4);
                        }
                        const orbCount = this.isBoss ? 3 : (this.typeKey === 'brute' ? 4 : (this.typeKey === 'runner' ? 2 : 1));
                        for (let i = 0; i < orbCount; i++) {
                            const value = this.isBoss ? 80 : Math.floor(this.xpValue / orbCount);
                            game.experienceOrbs.push({ x: this.x + rand(-8, 8), y: this.y + rand(-8, 8), value: value, life: 30, floatOffset: rand(0, Math.PI * 2) });
                        }
                        if (this.isBoss && game.player) {
                            game.player.hp = Math.min(game.player.maxHp, game.player.hp + game.player.maxHp * 0.3);
                            spawnParticles(game.player.x, game.player.y, 20, '#ffd700', 80, 0.6, 6);
                            game.bossOnField = false;
                            // 母皇死亡：巢穴崩塌，清除其幼体
                            if (this.typeKey === 'broodmother') {
                                for (const e of game.enemies) if (e.bossMinion === this) e.alive = false;
                            }
                            // 触发Boss掉落（已拥有的唯一道具不再出现）
                            if (!game.noBossDrop) {
                                const pool = BOSS_DROP_ITEMS.filter(it => !(it.id === 'soul_shield' && (game.player.soulShieldLevel || 0) >= 2));
                                const shuffled = [...pool].sort(() => Math.random() - 0.5);
                                game.bossDropChoices = shuffled.slice(0, 3);
                                showBossDropPanel(game.bossDropChoices);
                            }
                        }
                        // 炎术士死亡火焰区域
                        if (this.typeKey === 'pyromancer') {
                            game.fireZones.push({ x: this.x, y: this.y, radius: 55, damage: 4, remaining: 2, tickRate: 0.5, tickTimer: 0 });
                        }
                        spawnParticles(this.x, this.y, this.isBoss ? 35 : (this.typeKey === 'brute' ? 18 : 8), this.color, 100, 0.5, this.isBoss ? 7 : 4);
                        if (this.isBoss || this.typeKey === 'brute') triggerShake(5, 0.25);
                    } else {
                        spawnParticles(this.x, this.y, 2, '#ffffff', 30, 0.15, 1.5);
                    }
                    if (this.isBoss && !this.invincible && this.shieldRecharge <= 0 && this.shieldThresholds.length && this.hp <= this.maxHp * this.shieldThresholds[0]) {
                        const threshold = this.shieldThresholds[0];
                        this.shieldThresholds.shift();
                        const isPhase3Shield = this.typeKey === 'broodmother' && threshold <= 0.3;
                        const sc3 = ENEMY_TYPES[this.typeKey].scale || null;
                        this.activateShield(isPhase3Shield ? 300 : 0, isPhase3Shield && sc3 ? sc3.shieldRate3 : null);
                    }
                }

                applySlow(amount, duration) {
                    if (this.typeKey === 'assassin') return;
                    if (this.isBoss) amount = Math.max(0, amount - 0.25);
                    if (amount > this.slowAmount || this.slowTimer <= 0) this.slowAmount = amount;
                    this.slowTimer = Math.max(this.slowTimer, duration);
                }

                activateShield(extraBase = 0, rate = null) {
                    const base = (this.shieldBase || ENEMY_TYPES[this.typeKey].shieldBase) + extraBase;
                    const sc = ENEMY_TYPES[this.typeKey].scale || null;
                    const N = Math.max(1, game.bossAppearedCount);
                    const nk = Math.min(N - 1, 7);
                    const r = rate !== null ? rate : (sc ? sc.shieldRate : 0.25);
                    const shieldMult = sc ? Math.pow(1 + r, Math.min(nk, 6)) * (nk >= 7 ? 1.15 : 1) : 1;
                    this.shieldMax = Math.floor(base * shieldMult);
                    this.shieldHp = this.shieldMax;
                    this.invincible = true;
                    // 护盾无持续时间限制，只能被击破
                    this.shieldActivated = true;
                    spawnParticles(this.x, this.y, 20, '#aa00ff', 60, 0.5, 5);
                }

                update(dt, player) {
                    if (!this.alive) return;
                    if (this.flashTimer > 0) this.flashTimer -= dt;
                    updateBuffTimers(this, dt);
                    if (this.slowTimer > 0) this.slowTimer -= dt;
                    if (this.orbitHitCd > 0) this.orbitHitCd -= dt;
                    if (this.freezeTimer > 0) { this.freezeTimer -= dt; return; }
                    if (this.isBoss) {
                        if (this.shieldRecharge > 0) this.shieldRecharge -= dt;
                        if (this.stunTimer > 0) { this.stunTimer -= dt; return; }
                        if (this.invincible) {
                            if (this.shieldHp <= 0) {
                                this.invincible = false;
                                this.shieldHp = 0;
                                this.shieldRecharge = 8;
                                if (this.typeKey !== 'assassin') this.stunTimer = 1.5;
                                spawnParticles(this.x, this.y, 15, '#ffffff', 50, 0.4, 3);
                                return;
                            }
                        }
                        const hpRatio = this.hp / this.maxHp;
                        if (this.typeKey === 'broodmother') {
                            const phase3 = hpRatio < 0.25;
                            // ===== 母皇：召唤幼体（50%狂暴：2秒×4只；25%三阶段：1.6秒×4只且幼体强化30%） =====
                            let summonInt = this.summonInterval;
                            let summonN = this.summonCount;
                            if (hpRatio < 0.5) { summonInt = 2; summonN = 4; }
                            if (phase3) summonInt = 1.6;
                            this.summonTimer -= dt;
                            if (this.summonTimer <= 0) {
                                this.summonTimer = summonInt;
                                if (game.enemies.length < MAX_ENEMIES) {
                                    for (let i = 0; i < summonN; i++) {
                                        const ang = rand(0, Math.PI * 2);
                                        const mx = clamp(this.x + Math.cos(ang) * (this.size + 18), 20, W - 20);
                                        const my = clamp(this.y + Math.sin(ang) * (this.size + 18), 20, H - 20);
                                        const minion = new Enemy(mx, my, this.summonType, game.difficultyLevel - 1);
                                        minion.bossMinion = this;
                                        if (phase3) {
                                            minion.hp = Math.floor(minion.hp * 1.3);
                                            minion.maxHp = minion.hp;
                                            minion.damage = Math.floor(minion.damage * 1.3);
                                            minion.speed = minion.speed * 1.3;
                                        }
                                        game.enemies.push(minion);
                                    }
                                    spawnParticles(this.x, this.y, 12, this.color, 60, 0.4, 3);
                                    sound.play('summon');
                                }
                            }
                            // ===== 毒液喷射：周期朝玩家吐酸弹（三阶段：3秒一发，1秒自爆） =====
                            this.acidTimer -= dt;
                            if (this.acidTimer <= 0) {
                                this.acidTimer = phase3 ? 3 : this.acidCooldown;
                                if (dist(this, player) < this.acidRange) {
                                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                                    const pj = new Projectile(this.x, this.y, Math.cos(angle) * this.acidSpeed, Math.sin(angle) * this.acidSpeed, this.acidDamage, 0, 0, '#66ff44', 6, true);
                                    pj.acid = true;
                                    pj.acidPooled = false;
                                    pj.acidFuse = 1;
                                    pj.poolDamage = phase3 ? 15 : 10;
                                    pj.poolRadius = phase3 ? 85 : 75;
                                    game.projectiles.push(pj);
                                    sound.play('acidSpit');
                                    spawnParticles(this.x, this.y, 6, '#66ff44', 50, 0.3, 3);
                                }
                            }
                        } else if (this.typeKey === 'assassin') {
                            // ===== 暗影刺客：瞬影突进 + 残影 + 影刃回旋 =====
                            const enraged = hpRatio < 0.25 ? 2 : (hpRatio < 0.5 ? 1 : 0);
                            if (!this.teleporting) {
                                this.teleportTimer -= dt;
                                if (this.teleportTimer <= 0) {
                                    this.teleporting = true;
                                    this.teleportProgress = 0;
                                }
                            } else {
                                this.teleportProgress += dt;
                                if (this.teleportProgress >= this.chargeTime) {
                                    this.doTeleport(player);
                                    this.teleporting = false;
                                    this.teleportTimer = [4, 2.5, 1.5][enraged];
                                }
                            }
                            // 影刃回旋：朝玩家方向环形飞刀（狂暴时更快）
                            this.shurikenTimer -= dt;
                            if (this.shurikenTimer <= 0) {
                                this.shurikenTimer = enraged === 2 ? this.shurikenInterval * 0.6 : this.shurikenInterval;
                                this.fireShuriken(player);
                            }
                        } else {
                            // ===== 死神骑士：剑气 + 冲击波 + 狂暴 =====
                            let slashCd = this.slashCooldown;
                            if (hpRatio < 0.5) slashCd = this.slashCooldown * 0.8;
                            if (hpRatio < 0.25) slashCd = this.slashCooldown * 0.6;
                            if (!this.charging) {
                                this.slashTimer -= dt;
                                if (this.slashTimer <= 0) { this.charging = true; this.chargeProgress = 0; }
                            } else {
                                this.chargeProgress += dt;
                                if (this.chargeProgress >= this.chargeTime) {
                                    this.fireSlash(player);
                                    this.charging = false;
                                    this.slashTimer = slashCd;
                                }
                            }
                            // 冲击波技能
                            this.shockwaveTimer -= dt;
                            if (this.shockwaveTimer <= 0 && !this.shockwaveActive) {
                                this.shockwaveActive = true;
                                this.shockwaveRadius = 0;
                                this.shockwaveHit = false;
                                spawnParticles(this.x, this.y, 12, '#ff4400', 50, 0.4, 4);
                            }
                            if (this.shockwaveActive) {
                                this.shockwaveRadius += this.shockwaveSpeed * dt;
                                if (!this.shockwaveHit) {
                                    const playerDist = dist(player, this);
                                    if (playerDist > this.shockwaveInnerSafe && playerDist < this.shockwaveRadius) {
                                        player.takeDamage(this.shockwaveDamage);
                                        this.shockwaveHit = true;
                                        triggerShake(4, 0.2);
                                    }
                                }
                                if (this.shockwaveRadius >= this.shockwaveMaxRadius) {
                                    this.shockwaveActive = false;
                                    let swInt = this.shockwaveInterval;
                                    if (hpRatio < 0.5) swInt = this.shockwaveInterval * 0.8;
                                    this.shockwaveTimer = swInt;
                                }
                            }
                        }
                    }
                    const dx = player.x - this.x, dy = player.y - this.y, d = Math.hypot(dx, dy) || 0.01;
                    const spd = this.getEffectiveSpeed();
                    let mx = 0, my = 0;
                    if (this.isRanged) {
                        const desiredDist = this.attackRange + 50;
                        if (d < desiredDist - 30) { mx = -(dx / d); my = -(dy / d); }
                        else if (d > desiredDist + 30) { mx = dx / d; my = dy / d; }
                        this.fireballTimer -= dt;
                        if (this.fireballTimer <= 0 && d < this.attackRange + 100) {
                            this.fireAtPlayer(player);
                            this.fireballTimer = this.fireballCooldown;
                        }
                    } else { mx = dx / d; my = dy / d; }
                    let sepX = 0, sepY = 0;
                    for (const other of game.enemies) {
                        if (other === this || !other.alive) continue;
                        const od = dist(this, other), minDist = (this.size + other.size) * 0.9;
                        if (od < minDist && od > 0) { sepX += (this.x - other.x) / od * (minDist - od) * 0.5; sepY += (this.y - other.y) / od * (minDist - od) * 0.5; }
                    }
                    this.x += mx * spd * dt + sepX * dt * 0.8; this.y += my * spd * dt + sepY * dt * 0.8;
                    this.x = clamp(this.x, this.size, W - this.size); this.y = clamp(this.y, this.size, H - this.size);
                    if (dist(this, player) < this.size + player.size) {
                        if (this.isGhost) {
                            if (this.dotDamage > 0) {
                                player.dotEffects = player.dotEffects.filter(e => e.source !== this);
                                player.dotEffects.push({ amount: this.dotDamage, remaining: this.dotDuration, source: this });
                            }
                        } else if (!this.isRanged) {
                            player.takeDamage(this.damage);
                            const pushDx = this.x - player.x, pushDy = this.y - player.y, pushD = Math.hypot(pushDx, pushDy) || 1;
                            this.x = player.x + pushDx / pushD * (this.size + player.size + 2);
                            this.y = player.y + pushDy / pushD * (this.size + player.size + 2);
                        }
                    }
                }

                fireAtPlayer(player) {
                    // 远程伤害随难度提升（每级 +10%，上限 2 倍）
                    const diffBonus = game.difficultyLevel - 1;
                    const dynamicDamage = Math.min(this.fireballDamage * (1 + diffBonus * 0.10), this.fireballDamage * 2.0);
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    const vx = Math.cos(angle) * this.fireballSpeed;
                    const vy = Math.sin(angle) * this.fireballSpeed;
