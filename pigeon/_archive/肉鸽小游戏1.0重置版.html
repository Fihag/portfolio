                    game.projectiles.push(new Projectile(this.x, this.y, vx, vy, dynamicDamage, 0, 0, '#ff4422', 4, true));
                }

                fireSlash(player) {
                    // 剑气伤害随出场次数成长（构造时已算好）
                    const dynamicDamage = this.slashDamage;
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    const vx = Math.cos(angle) * this.slashSpeed;
                    const vy = Math.sin(angle) * this.slashSpeed;
                    game.projectiles.push(new Projectile(this.x, this.y, vx, vy, dynamicDamage, 0, 0, '#ff0000', 15, true));
                    spawnParticles(this.x, this.y, 10, '#ff0000', 40, 0.4, 3);
                }

                fireFanSlash(player, dmgScale = 1) {
                    // 扇形剑气三连发（暗影刺客主体 + 残影），每道剑气独立伤害不受无敌帧限制
                    const dynamicDamage = Math.floor(this.slashDamage * dmgScale);
                    const base = Math.atan2(player.y - this.y, player.x - this.x);
                    const spread = 0.25;
                    for (let i = -1; i <= 1; i++) {
                        const a = base + spread * i;
                        const pj = new Projectile(this.x, this.y, Math.cos(a) * this.slashSpeed, Math.sin(a) * this.slashSpeed, dynamicDamage, 0, 0, '#b06aff', 12, true);
                        pj.ignoreIFrame = true;
                        game.projectiles.push(pj);
                    }
                    spawnParticles(this.x, this.y, 8, '#b06aff', 50, 0.4, 3);
                }

                fireShuriken(player) {
                    // 影刃回旋：朝玩家方向聚拢扇形飞刀（更集中，非全圈散开）
                    const base = Math.atan2(player.y - this.y, player.x - this.x);
                    const spread = 0.55;
                    for (let i = 0; i < this.shurikenCount; i++) {
                        const t = this.shurikenCount > 1 ? i / (this.shurikenCount - 1) - 0.5 : 0;
                        const a = base + spread * t;
                        game.projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * this.shurikenSpeed, Math.sin(a) * this.shurikenSpeed, this.shurikenDamage, 0, 0, '#8a4bd8', 6, true));
                    }
                    spawnParticles(this.x, this.y, 10, '#8a4bd8', 60, 0.4, 3);
                }

                doTeleport(player) {
                    // 瞬影突进：闪现到玩家侧后方，起点留残影（减速区域 + 一次30%剑气），落地扇形三连
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    const side = Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2;
                    const tx = clamp(player.x + Math.cos(angle + Math.PI + side) * 120, 40, W - 40);
                    const ty = clamp(player.y + Math.sin(angle + Math.PI + side) * 120, 40, H - 40);
                    // 起点残影
                    game.shadowZones.push({ x: this.x, y: this.y, remaining: 1.5, echoTimer: 0.3, echoFired: false, echoDamage: Math.floor(this.slashDamage * 0.3), echoSpeed: this.slashSpeed });
                    spawnParticles(this.x, this.y, 24, '#b06aff', 90, 0.5, 4);
                    spawnParticles(this.x, this.y, 12, '#ffffff', 70, 0.35, 2.5);
                    spawnParticles(this.x, this.y, 10, '#5a2a7a', 60, 0.6, 3);
                    // 瞬移拖影
                    if (!game.shadowTrails) game.shadowTrails = [];
                    for (let k = 1; k <= 7; k++) {
                        const t = k / 8;
                        game.shadowTrails.push({ x: this.x + (tx - this.x) * t + rand(-5, 5), y: this.y + (ty - this.y) * t + rand(-5, 5), life: 0.35 + t * 0.2, maxLife: 0.55, size: 8 + t * 6 });
                    }
                    // 瞬移
                    this.x = tx; this.y = ty;
                    spawnParticles(this.x, this.y, 26, '#b06aff', 100, 0.55, 4.5);
                    spawnParticles(this.x, this.y, 12, '#ffffff', 80, 0.4, 3);
                    triggerShake(4, 0.2);
                    // 落地扇形三连
                    this.fireFanSlash(player);
                }

                draw(ctx) {
                    const flashOn = this.flashTimer > 0;
                    if (this.isBoss) {
                        const auraGrad = ctx.createRadialGradient(this.x, this.y, this.size * 1.2, this.x, this.y, this.size * 2);
                        auraGrad.addColorStop(0, this.auraColor); auraGrad.addColorStop(1, 'rgba(80,0,80,0)');
                        ctx.fillStyle = auraGrad; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2); ctx.fill();
                        if (this.typeKey === 'boss' && this.hp / this.maxHp < 0.5) {
                            const rageAura = ctx.createRadialGradient(this.x, this.y, this.size * 1.2, this.x, this.y, this.size * 2.2);
                            rageAura.addColorStop(0, `rgba(255,40,20,${0.35 + Math.sin(game.time * 8) * 0.15})`);
                            rageAura.addColorStop(1, 'rgba(255,40,20,0)');
                            ctx.fillStyle = rageAura; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2.2, 0, Math.PI * 2); ctx.fill();
                        }
                        if (this.invincible && this.shieldHp > 0) {
                            ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 4;
                            ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 8, 0, Math.PI * 2); ctx.stroke();
                            const barW = this.size * 2.2;
                            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(this.x - barW / 2, this.y - this.size - 18, barW, 6);
                            ctx.fillStyle = '#ff00ff'; ctx.fillRect(this.x - barW / 2, this.y - this.size - 18, barW * (this.shieldHp / this.shieldMax), 6);
                        }
                    }
                    ctx.fillStyle = flashOn ? '#ffffff' : this.color;
                    ctx.strokeStyle = flashOn ? '#fff' : 'rgba(255,255,255,0.4)'; ctx.lineWidth = this.isBoss ? 3 : 1.5;
                    ctx.beginPath();
                    if (this.shape === 'circle') ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    else if (this.shape === 'triangle') { const s = this.size; ctx.moveTo(this.x, this.y - s); ctx.lineTo(this.x + s * 0.87, this.y + s * 0.5); ctx.lineTo(this.x - s * 0.87, this.y + s * 0.5); ctx.closePath(); }
                    else if (this.shape === 'square') ctx.rect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                    ctx.fill(); ctx.stroke();
                    if (this.isGhost) { ctx.fillStyle = 'rgba(200,200,255,0.3)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 4, 0, Math.PI * 2); ctx.fill(); }
                    if (this.slowTimer > 0) { ctx.fillStyle = 'rgba(150,200,255,0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 3, 0, Math.PI * 2); ctx.fill(); }
                    if (this.freezeTimer > 0) {
                        ctx.fillStyle = 'rgba(130,220,255,0.5)';
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 5, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        for (let i = 0; i < 4; i++) {
                            const fx = this.x + Math.cos(i * Math.PI / 2 + game.time * 3) * (this.size + 2);
                            const fy = this.y + Math.sin(i * Math.PI / 2 + game.time * 3) * (this.size + 2);
                            ctx.beginPath(); ctx.arc(fx, fy, 1.8, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                    if (this.typeKey === 'broodmother') {
                        ctx.strokeStyle = 'rgba(150,220,120,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([5, 7]);
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 10, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
                        for (let i = 0; i < 4; i++) {
                            const ea = game.time * 0.8 + i * Math.PI / 2;
                            const ex = this.x + Math.cos(ea) * (this.size + 6);
                            const ey = this.y + Math.sin(ea) * (this.size + 6);
                            ctx.fillStyle = 'rgba(230,255,220,0.9)';
                            ctx.beginPath(); ctx.ellipse(ex, ey, 3, 4.5, ea, 0, Math.PI * 2); ctx.fill();
                        }
                        if (this.summonType && this.summonTimer < 0.5 && !this.invincible) {
                            const pulse = 0.5 + Math.sin(game.time * 18) * 0.5;
                            ctx.strokeStyle = `rgba(160,255,120,${0.4 + pulse * 0.5})`; ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 12 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
                        }
                    }
                    if (this.typeKey === 'assassin') {
                        // 角色特征：旋转暗影刀锋环 + 暗影波动
                        const spin = game.time * 2.2;
                        const pr2 = this.size + 16 + Math.sin(game.time * 5) * 2;
                        for (let k = 0; k < 3; k++) {
                            const ba = spin + k * Math.PI * 2 / 3;
                            const bx = this.x + Math.cos(ba) * pr2;
                            const by = this.y + Math.sin(ba) * pr2;
                            ctx.save();
                            ctx.translate(bx, by);
                            ctx.rotate(ba + Math.PI / 2);
                            ctx.fillStyle = 'rgba(200,160,255,0.85)';
                            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(3, 6); ctx.lineTo(-3, 6); ctx.closePath();
                            ctx.fill(); ctx.stroke();
                            ctx.restore();
                        }
                        const wv = 0.4 + Math.sin(game.time * 4) * 0.2;
                        ctx.strokeStyle = `rgba(120,60,190,${wv})`; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 22 + Math.sin(game.time * 3) * 3, 0, Math.PI * 2); ctx.stroke();
                    }
                    if (this.typeKey === 'assassin' && this.teleporting) {
                        const progress = this.teleportProgress / this.chargeTime;
                        const pulse = 0.6 + Math.sin(game.time * 20) * 0.4;
                        ctx.strokeStyle = `rgba(176,106,255,${0.5 + progress * 0.5})`; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 12 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
                    }
                    if (this.isBoss && this.charging) {
                        const progress = this.chargeProgress / this.chargeTime;
                        ctx.strokeStyle = `rgba(255,0,0,${0.5+progress*0.5})`; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 12, -Math.PI/2, -Math.PI/2 + Math.PI*2*progress); ctx.stroke();
                    }
                    // 冲击波绘制
                    if (this.isBoss && this.shockwaveActive) {
                        const r = this.shockwaveRadius;
                        const alpha = 1 - r / this.shockwaveMaxRadius;
                        ctx.strokeStyle = `rgba(255, 80, 0, ${alpha * 0.8})`; ctx.lineWidth = 6;
                        ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.stroke();
                        ctx.strokeStyle = `rgba(255, 200, 50, ${alpha * 0.4})`; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.stroke();
                        // 内圈安全区标记
                        ctx.strokeStyle = `rgba(255, 100, 0, ${alpha * 0.3})`; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.shockwaveInnerSafe, 0, Math.PI * 2); ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if (this.isBoss || this.typeKey === 'brute') {
                        const barW = this.size * 2, barH = 4, barY = this.y - this.size - 10;
                        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(this.x - barW / 2, barY, barW, barH);
                        ctx.fillStyle = '#ff4466'; ctx.fillRect(this.x - barW / 2, barY, barW * (this.hp / this.maxHp), barH);
                    }
                }
            }

            // ==================== 投射物 ====================
            class Projectile {
                constructor(x, y, vx, vy, damage, splashRadius = 0, splashDamagePercent = 0, color = '#ffaa44', size = 4.5, isEnemy = false) {
                    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.damage = damage;
                    this.splashRadius = splashRadius; this.splashDamagePercent = splashDamagePercent;
                    this.color = color; this.size = size; this.alive = true;
                    this.trailPositions = []; this.lifetime = 0; this.maxLifetime = isEnemy ? 4 : 3;
                    this.isEnemy = isEnemy;
                }
                update(dt) {
                    if (this.acidFuse !== undefined) { this.acidFuse -= dt; if (this.acidFuse <= 0) this.alive = false; }
                    this.lifetime += dt; if (this.lifetime > this.maxLifetime) this.alive = false;
                    if (this.lifetime > 0.02) { this.trailPositions.push({ x: this.x, y: this.y, life: 0.2 }); if (this.trailPositions.length > 12) this.trailPositions.shift(); }
                    for (const tp of this.trailPositions) tp.life -= dt;
                    this.trailPositions = this.trailPositions.filter(tp => tp.life > 0);
                    this.x += this.vx * dt; this.y += this.vy * dt;
                    if (this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30) this.alive = false;
                }
                draw(ctx) {
                    if (this.isEnemy) {
                        if (this.acid) {
                            // 毒液拖尾
                            for (let i = 0; i < this.trailPositions.length; i++) {
                                const tp = this.trailPositions[i];
                                ctx.globalAlpha = (tp.life / 0.2) * 0.4;
                                ctx.fillStyle = this.color;
                                ctx.beginPath(); ctx.arc(tp.x, tp.y, this.size * (0.3 + i / this.trailPositions.length * 0.5), 0, Math.PI * 2); ctx.fill();
                            }
                            ctx.globalAlpha = 1;
                            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2.2);
                            grad.addColorStop(0, '#ccffcc'); grad.addColorStop(0.4, this.color); grad.addColorStop(1, 'rgba(120,255,80,0)');
                            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2.2, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = '#eaffea'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.55, 0, Math.PI * 2); ctx.fill();
                        } else {
                            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2); ctx.fill();
                        }
                    } else {
                        for (let i = 0; i < this.trailPositions.length; i++) {
                            const tp = this.trailPositions[i];
                            ctx.globalAlpha = (tp.life / 0.2) * 0.5;
                            ctx.fillStyle = this.color;
                            ctx.beginPath(); ctx.arc(tp.x, tp.y, this.size * (0.4 + i / this.trailPositions.length * 0.6), 0, Math.PI * 2); ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                        grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, this.color); grad.addColorStop(1, 'rgba(255,150,30,0)');
                        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }

            // ==================== 升级逻辑 ====================
            function generateUpgradeChoices(player) {
                const available = [];
                for (const skill of SKILL_REGISTRY) {
                    if (!skill.applies(player)) continue;
                    const currentLevel = getSkillCurrentLevel(player, skill);
                    if (currentLevel >= skill.maxLevel) continue;
                    if (skill.maxLevel === 1 && currentLevel >= 1) continue;
                    available.push(skill);
                }
                const shuffled = [...available].sort(() => Math.random() - 0.5);
                const choiceCount = 5 + (player.extraChoices || 0);
                let choices = shuffled.slice(0, choiceCount);
                if (player.extraChoices) player.extraChoices = 0;
                if (game.upgradeCount <= 2) {
                    const unlockedWeapons = player.weapons.map(w => w.type);
                    const weaponSkillMap = { 'unlock_magic': 'magic_missile', 'unlock_orbit': 'orbit_blade', 'unlock_frost': 'frost_nova', 'unlock_chain': 'lightning_chain', 'unlock_meteor': 'meteor', 'unlock_shadow': 'shadow_spirit' };
                    const weaponSkills = Object.keys(weaponSkillMap);
                    const missingWeaponSkill = weaponSkills.find(sid => !unlockedWeapons.includes(weaponSkillMap[sid]));
                    if (missingWeaponSkill && !choices.some(s => s.id === missingWeaponSkill)) {
                        const skill = SKILL_REGISTRY.find(s => s.id === missingWeaponSkill);
                        if (skill && skill.applies(player) && getSkillCurrentLevel(player, skill) < skill.maxLevel) {
                            choices.pop(); choices.unshift(skill);
                        }
                    }
                }
                return choices;
            }

            function getSkillCurrentLevel(player, skill) {
                return player['_skill_' + skill.id] || 0;
            }

            function showLevelupPanel(choices) {
                levelupCards.innerHTML = '';
                choices.forEach((skill, i) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const currentLvl = getSkillCurrentLevel(game.player, skill);
                    card.innerHTML = `<span class="icon">${ICONS[skill.icon] || ''}</span><span class="name">${skill.name}</span><span class="desc">${skill.desc}</span><span class="level-tag">Lv.${currentLvl+1}/${skill.maxLevel}</span>`;
                    card.addEventListener('click', (e) => { e.stopPropagation(); game.applyUpgrade(skill); });
                    card.addEventListener('touchend', (e) => { e.stopPropagation(); e.preventDefault(); game.applyUpgrade(skill); });
                    levelupCards.appendChild(card);
                });
                levelupPanel.style.display = 'flex';
                game.rerollUsed = false;
                skipBtn.disabled = false;
                skipBtn.style.opacity = '1';
                skipBtn.style.cursor = 'pointer';
            }

            
            function showBossDropPanel(choices) {
                bossdropCards.innerHTML = '';
                sound.play('bossDrop');
                choices.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const d = typeof item.desc === 'function' ? item.desc(game.player) : item.desc;
                    card.innerHTML = `<span class="icon">${ICONS[item.icon] || ''}</span><span class="name">${item.name}</span><span class="desc">${d}</span>`;
                    card.addEventListener('click', (e) => { e.stopPropagation(); applyBossDrop(item); });
                    card.addEventListener('touchend', (e) => { e.stopPropagation(); e.preventDefault(); applyBossDrop(item); });
                    bossdropCards.appendChild(card);
                });
                bossdropPanel.style.display = 'flex';
                game.state = 'bossdrop';
            }

            function applyBossDrop(item) {
                if (game.state !== 'bossdrop') return;
                try { item.apply(game.player); } catch(e) { console.warn('Boss drop apply error:', e); }
                bossdropPanel.style.display = 'none';
                bossdropCards.innerHTML = '';
                game.bossDropChoices = null;
                game.state = 'playing';
                game.player.invincibleTimer = 0.5;
            }

            game.applyUpgrade = function(skill) {
                if (game.state !== 'levelup') return;
                const player = game.player;
                player['_skill_' + skill.id] = (player['_skill_' + skill.id] || 0) + 1;
                try { skill.apply(player); } catch(e) { console.warn('Skill apply error:', e); }
                levelupPanel.style.display = 'none';
                levelupCards.innerHTML = '';
                game.currentChoices = null;
                game.state = 'playing';
                player.invincibleTimer = 0.4;
            };

            skipBtn.addEventListener('click', () => {
                if (game.state !== 'levelup') return;
                if (game.rerollUsed) return;
                const player = game.player;
                game.rerollUsed = true;
                game.currentChoices = generateUpgradeChoices(player);
                if (!game.currentChoices.length) {
                    levelupPanel.style.display = 'none';
                    levelupCards.innerHTML = '';
                    game.currentChoices = null;
                    game.state = 'playing';
                    return;
                }
                levelupCards.innerHTML = '';
                game.currentChoices.forEach((skill, i) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const currentLvl = getSkillCurrentLevel(player, skill);
                    card.innerHTML = `<span class="icon">${ICONS[skill.icon] || ''}</span><span class="name">${skill.name}</span><span class="desc">${skill.desc}</span><span class="level-tag">Lv.${currentLvl+1}/${skill.maxLevel}</span>`;
                    card.addEventListener('click', (e) => { e.stopPropagation(); game.applyUpgrade(skill); });
                    card.addEventListener('touchend', (e) => { e.stopPropagation(); e.preventDefault(); game.applyUpgrade(skill); });
                    levelupCards.appendChild(card);
                });
                skipBtn.disabled = true;
                skipBtn.style.opacity = '0.4';
                skipBtn.style.cursor = 'not-allowed';
            });

            skipXpBtn.addEventListener('click', () => {
                if (game.state !== 'levelup') return;
                const player = game.player;
                const xpGain = Math.floor(player.xpToNext * 0.5);
                levelupPanel.style.display = 'none';
                levelupCards.innerHTML = '';
                game.currentChoices = null;
                game.state = 'playing';
                player.invincibleTimer = 0.4;
                player.addXp(xpGain);
            });

            function initGame() {
                const diff = DIFFICULTIES[game.selectedDifficulty] || DIFFICULTIES.normal;
                const wpnDef = START_WEAPON_DEFS[game.selectedWeapon] || START_WEAPON_DEFS.magic_missile;
                game.player = new Player();
                game.player.weapons = [wpnDef()];
                game.player.maxHp = diff.playerHp;
                game.player.hp = diff.playerHp;
                game.enemies = []; game.projectiles = []; game.experienceOrbs = [];
                particles = []; damageNumbers = [];
                game.time = 0; game.score = 0; game.kills = 0; game.totalDamageDealt = 0;
                game.spawnTimer = 0; game.spawnInterval = diff.spawnInterval;
                game.difficultyLevel = diff.diffStart; game.diffMult = diff.mult;
                game.state = 'playing'; game.currentChoices = null;
                game.upgradeCount = 0;
                game.bossTimer = diff.bossTimer; game.bossAppearedCount = 0; game.bossOnField = false;
                game.warningText = ''; game.warningTimer = 0;
                game.fireZones = [];
                game.burningZones = []; game.chainLightningVisuals = []; game.bossDropChoices = null; game.meteorVisuals = [];
                game.shadowZones = [];
                game.shadowTrails = [];
                game.noBossDrop = false;
                screenShake = { intensity: 0, duration: 0, elapsed: 0 };
                paused = false;
                btnPause.innerHTML = ICONS.pause;
                levelupPanel.style.display = 'none'; gameoverOverlay.style.display = 'none';
                bossdropPanel.style.display = 'none'; bossdropCards.innerHTML = '';
                levelupCards.innerHTML = '';
                game.rerollUsed = false;
                skipBtn.disabled = false;
                skipBtn.style.opacity = '1';
                skipBtn.style.cursor = 'pointer';
                game.player.x = W / 2; game.player.y = H / 2;
                resizeCanvas();
            }

            function updateWeapons(player, dt) {
                for (const w of player.weapons) {
                    if (w.type === 'magic_missile') {
                        const cd = w.cooldownTime * (w.cooldownMultiplier || 1) * (player.globalCooldownMultiplier || 1);
                        if (w.cooldown <= 0) {
                            const nearest = player.getNearestEnemy();
                            if (nearest) {
                                const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                                const total = 1 + (w.extraProjectiles || 0);
                                const spread = 0.10;
                                for (let i = 0; i < total; i++) {
                                    let a = angle;
                                    if (total > 1) a = angle - spread * (total - 1) / 2 + spread * i;
                                    const vx = Math.cos(a) * w.projectileSpeed, vy = Math.sin(a) * w.projectileSpeed;
                                    const dmg = w.damage * w.damageMultiplier * player.globalDamageMultiplier;
                                    const proj = new Projectile(player.x, player.y, vx, vy, dmg, w.splashRadius || 0, w.splashDamagePercent || 0, '#ff9933');
                                    proj.knockback = w.knockback || 0;
                                    game.projectiles.push(proj);
                                    sound.play('shoot');
                                }
                                w.cooldown = cd;
                            }
                        }
                    } else if (w.type === 'orbit_blade') {
                        for (let i = 0; i < w.bladeCount; i++) {
                            const ba = w.angle + (Math.PI * 2 / w.bladeCount) * i;
                            const bx = player.x + Math.cos(ba) * w.radius, by = player.y + Math.sin(ba) * w.radius;
                            for (const enemy of game.enemies) {
                                if (!enemy.alive || enemy.orbitHitCd > 0) continue;
                                if (Math.hypot(bx - enemy.x, by - enemy.y) < w.radius * 0.25 + enemy.size) {
                                    let dmg = w.damage * w.damageMultiplier * player.globalDamageMultiplier;
                                    if (player.synergyBladeSpeed) {
                                        const moveBonus = Math.min(0.4, ((player.speedMultiplier || 1) - 1) * 0.5);
                                        dmg *= (1 + moveBonus);
                                    }
                                    enemy.takeDamage(dmg, 'orbit'); enemy.orbitHitCd = w.hitCdTime;
                                    spawnParticles(bx, by, 3, '#aaddff', 40, 0.2, 2);
                                }
                            }
                        }
                    } else if (w.type === 'frost_nova') {
                        if (w.cooldown <= 0) {
                            const dmg = w.damage * w.damageMultiplier * player.globalDamageMultiplier;
                            for (const enemy of game.enemies) {
                                if (!enemy.alive) continue;
                                if (dist(player, enemy) < w.radius) {
                                    enemy.takeDamage(dmg, 'frost');
                                    enemy.applySlow(w.slowAmount, w.slowDuration);
                                    if (w.freezeDuration && !enemy.isBoss) enemy.freezeTimer = w.freezeDuration;
                                }
                            }
                            spawnParticles(player.x, player.y, 25, '#aaddff', w.radius * 0.6, 0.5, 5);
                            triggerShake(2, 0.12);
                            w.cooldown = w.cooldownTime * (player.globalCooldownMultiplier || 1);
                        }
                        // 冰霜光环减速 25%（已加强）
                        const auraRadius = w.radius * 0.6;
                        for (const enemy of game.enemies) {
                            if (!enemy.alive) continue;
                            if (dist(player, enemy) < auraRadius) {
                                enemy.applySlow(0.25, 0.5);
                            }
                        }
                    } else if (w.type === 'lightning_chain') {
                        const cd = w.cooldownTime * (player.globalCooldownMultiplier || 1);
                        if (w.cooldown <= 0) {
                            const nearest = player.getNearestEnemy();
                            if (nearest) {
                                const dmg = w.damage * w.damageMultiplier * player.globalDamageMultiplier;
                                const hitEnemies = new Set();
                                let current = nearest;
                                let currentDmg = dmg;
                                hitEnemies.add(current);
                                current.takeDamage(currentDmg, 'lightning');
                                sound.play('lightning');
                                game.chainLightningVisuals.push({ x1: player.x, y1: player.y, x2: current.x, y2: current.y, life: 0.25 });
                                spawnParticles(current.x, current.y, 5, '#ffff44', 60, 0.3, 3);
                                let prev = current;
                                for (let b = 0; b < w.bounceCount; b++) {
                                    let nextEnemy = null, minDist = w.bounceRange;
                                    for (const e of game.enemies) {
                                        if (!e.alive) continue;
                                        if (w.allowRehit) {
                                            if (Math.hypot(e.x - prev.x, e.y - prev.y) < minDist) {
                                                minDist = Math.hypot(e.x - prev.x, e.y - prev.y);
                                                nextEnemy = e;
                                            }
                                        } else {
                                            if (hitEnemies.has(e)) continue;
                                            if (Math.hypot(e.x - prev.x, e.y - prev.y) < minDist) {
                                                minDist = Math.hypot(e.x - prev.x, e.y - prev.y);
                                                nextEnemy = e;
                                            }
                                        }
                                    }
                                    if (!nextEnemy) break;
                                    currentDmg *= (1 - w.damageFalloff);
                                    hitEnemies.add(nextEnemy);
                                    nextEnemy.takeDamage(currentDmg, 'lightning');
                                    game.chainLightningVisuals.push({ x1: prev.x, y1: prev.y, x2: nextEnemy.x, y2: nextEnemy.y, life: 0.2 });
                                    spawnParticles(nextEnemy.x, nextEnemy.y, 3, '#ffff44', 40, 0.2, 2);
                                    prev = nextEnemy;
                                }
                                w.cooldown = cd;
                            }
                        }
                    } else if (w.type === 'meteor') {
                        const cd = w.cooldownTime * (player.globalCooldownMultiplier || 1);
                        if (w.cooldown <= 0 && game.enemies.length > 0) {
                            const targets = game.enemies.filter(e => e.alive);
                            if (targets.length > 0) {
                                const dropMeteor = (tx, ty) => {
                                    game.meteorVisuals.push({
                                        x: tx, y: ty - 300, targetY: ty,
                                        fallSpeed: 600, damage: w.damage * w.damageMultiplier * player.globalDamageMultiplier,
                                        radius: w.radius, landed: false, leaveBurning: w.leaveBurning || false,
                                        burningDuration: w.burningDuration || 3,
                                        burningTickRate: w.burningTickRate || 0.5,
                                        burningDamagePercent: w.burningDamagePercent || 0.3
                                    });
                                };
                                const t = targets.reduce((a, b) => a.hp > b.hp ? a : b);
                                dropMeteor(t.x, t.y);
                                if (Math.random() < (w.doubleChance || 0)) {
                                    const t2 = targets.reduce((a, b) => a.hp > b.hp ? a : b);
                                    setTimeout(() => { if (game.state === 'playing' && game.player === player) dropMeteor(t2.x, t2.y); }, 200);
                                }
                                w.cooldown = cd;
                            }
                        }
                    } else if (w.type === 'shadow_spirit') {
                        // ===== 精灵锁敌：锁定=前摇(纯时间)，前摇完成按攻速持续攻击 =====
                        const lockTime = Math.max(0.1, 1.0 - (w.lockReduction || 0));
                        const attackInterval = 1 / ((w.attackSpeed || 1.25) * (w.attackSpeedMultiplier || 1));
                        // 精灵状态容器
                        if (!w.spiritStates || w.spiritStates.length !== w.spiritCount) {
                            w.spiritStates = [];
                            for (let s = 0; s < w.spiritCount; s++) {
                                w.spiritStates.push({ x: player.x, y: player.y, target: null, lockTimer: 0, attackTimer: 0 });
                            }
                        }
                        const alive = game.enemies.filter(e => e && e.alive);
                        // A. 独立锁敌：优先分配未被锁定的目标，各精灵锁距自身最近的存活敌人（全图）
                        // 报复机制：玩家刚受击时，精灵强制锁定距玩家最近的敌人
                        const revenge = player.revengeTimer > 0;
                        let revengeTarget = null;
                        if (revenge) {
                            let minD = Infinity;
                            for (const e of alive) {
                                const d = Math.hypot(e.x - player.x, e.y - player.y);
                                if (d < minD) { minD = d; revengeTarget = e; }
                            }
                        }
                        for (let s = 0; s < w.spiritCount; s++) {
                            const st = w.spiritStates[s];
                            if (st.target && !st.target.alive) { st.target = null; st.lockTimer = 0; st.attackTimer = 0; }
                            if (revengeTarget) {
                                if (st.target !== revengeTarget) { st.target = revengeTarget; st.lockTimer = 0; st.attackTimer = 0; }
                                continue;
                            }
                            if (st.target) continue;
                            let best = null, bestD = Infinity;
                            // 敌人不足时允许全部精灵堆叠同一目标（集中火力）；敌人充足时分散（每目标1只）
                            const maxPerTarget = alive.length <= w.spiritCount ? w.spiritCount : 1;
                            for (const e of alive) {
                                const taken = w.spiritStates.some(o => o !== st && o.target === e);
                                if (taken && w.spiritStates.filter(o => o.target === e).length >= maxPerTarget) continue;
                                const d = Math.hypot(e.x - st.x, e.y - st.y);
                                if (d < bestD) { bestD = d; best = e; }
                            }
                            if (best) { st.target = best; st.lockTimer = 0; st.attackTimer = 0; }
                        }
                        // 移动 + 前摇 + 攻速攻击
                        for (let s = 0; s < w.spiritCount; s++) {
                            const st = w.spiritStates[s];
                            if (st.target) {
                                const t = st.target;
                                // 瞬移到目标身边环绕
                                const angle = (Math.PI * 2 / w.spiritCount) * s + game.time * 1.5;
                                const orbitR = (t.size || 10) + 18;
                                st.x = t.x + Math.cos(angle) * orbitR;
                                st.y = t.y + Math.sin(angle) * orbitR;
                                if (st.lockTimer < lockTime) {
                                    // 前摇阶段：纯时间累积（不受攻速影响）
                                    st.lockTimer += dt;
                                } else {
                                    // 前摇完成：按攻速持续攻击同一目标
                                    st.attackTimer -= dt;
                                    if (st.attackTimer <= 0) {
                                        st.attackTimer = attackInterval;
                                        const dmg = w.damage * w.damageMultiplier * player.globalDamageMultiplier;
                                        const dx = t.x - st.x, dy = t.y - st.y;
                                        const dd = Math.hypot(dx, dy) || 1;
                                        const spd = 300;
                                        const proj = new Projectile(st.x, st.y, dx / dd * spd, dy / dd * spd, dmg, 0, 0, '#9955ff', 5);
                                        proj.shadowSlow = true;
                                        proj.slowChance = w.slowChance || 0;
                                        proj.slowAmount = w.slowAmount || 0.3;
                                        proj.slowDuration = w.slowDuration || 1.5;
                                        game.projectiles.push(proj);
                                        sound.play('spirit');
                                    }
                                }
                            } else {
                                // 无目标：回玩家身边绕圈
                                const angle = (Math.PI * 2 / w.spiritCount) * s + game.time * 0.5;
                                st.x = player.x + Math.cos(angle) * 50;
                                st.y = player.y + Math.sin(angle) * 50;
                                st.lockTimer = 0;
                                st.attackTimer = 0;
                            }
                        }
                    }
                }
            }

            function drawWeaponsVisuals(player, ctx) {
                for (const w of player.weapons) {
                    if (w.type === 'orbit_blade') {
                        for (let i = 0; i < w.bladeCount; i++) {
                            const ba = w.angle + (Math.PI * 2 / w.bladeCount) * i;
                            const bx = player.x + Math.cos(ba) * w.radius, by = player.y + Math.sin(ba) * w.radius;
                            const grad = ctx.createRadialGradient(bx, by, 0, bx, by, 10);
                            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#88ccff'); grad.addColorStop(1, 'rgba(100,180,255,0)');
                            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill();
                            ctx.save(); ctx.translate(bx, by); ctx.rotate(ba + Math.PI / 2);
                            ctx.fillStyle = '#ddeeff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(4, 7); ctx.lineTo(-4, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
                            ctx.restore();
                        }
                    }
                }
                if (player.weapons.some(w => w.type === 'frost_nova')) {
                    const w = player.weapons.find(w => w.type === 'frost_nova');
                    const pulse = 0.8 + Math.sin(game.time * 2) * 0.2;
                    ctx.strokeStyle = `rgba(150, 220, 255, ${0.2 * pulse})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 10]);
                    ctx.beginPath(); ctx.arc(player.x, player.y, w.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
                    ctx.setLineDash([]);
                }
                // 绘制火焰/毒液区域
                if (game.fireZones) {
                    for (const zone of game.fireZones) {
                        const alpha = Math.min(1, zone.remaining / 2) * 0.5;
                        ctx.fillStyle = `rgba(${zone.rgb || '255, 100, 0'}, ${alpha})`;
                        ctx.beginPath(); ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2); ctx.fill();
                    }
                }
                if (game.burningZones) {
                    for (const zone of game.burningZones) {
                        const alpha = Math.min(1, zone.remaining / 3) * 0.4;
                        ctx.fillStyle = `rgba(255, 60, 0, ${alpha})`;
                        ctx.beginPath(); ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2); ctx.fill();
                    }
                }
                if (game.shadowZones) {
                    for (const sz of game.shadowZones) {
                        const alpha = Math.min(1, sz.remaining / 1.5) * 0.35;
                        const grad = ctx.createRadialGradient(sz.x, sz.y, 0, sz.x, sz.y, 90);
                        grad.addColorStop(0, `rgba(176,106,255,${alpha * 0.6})`);
                        grad.addColorStop(1, 'rgba(176,106,255,0)');
                        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(sz.x, sz.y, 90, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = `rgba(200,160,255,${alpha * 0.8})`; ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
                        ctx.beginPath(); ctx.arc(sz.x, sz.y, 90, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
                if (game.shadowTrails) {
                    for (const tr of game.shadowTrails) {
                        const a = tr.life / tr.maxLife;
                        ctx.fillStyle = `rgba(150,80,220,${a * 0.5})`;
                        ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.size * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = `rgba(220,180,255,${a * 0.7})`;
                        ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.size * 0.4 * a, 0, Math.PI * 2); ctx.fill();
                    }
                }
                // 绘制陨石下落动画
                if (game.meteorVisuals) {
                    for (const m of game.meteorVisuals) {
                        if (!m.landed) {
                            // 下落中的陨石
                            ctx.save();
                            ctx.translate(m.x, m.y);
                            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                            grad.addColorStop(0, '#ffff88');
                            grad.addColorStop(0.4, '#ff6600');
                            grad.addColorStop(1, 'rgba(255,0,0,0)');
                            ctx.fillStyle = grad;
                            ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = '#ffcc44';
                            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
                            // 尾焰
                            ctx.strokeStyle = 'rgba(255, 150, 0, 0.6)';
                            ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, -40); ctx.stroke();
                            ctx.strokeStyle = 'rgba(255, 80, 0, 0.4)';
                            ctx.lineWidth = 5;
                            ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, -30); ctx.stroke();
                            ctx.restore();
                            // 落点标记
                            ctx.strokeStyle = `rgba(255, 100, 0, ${0.3 + Math.sin(game.time * 10) * 0.15})`;
                            ctx.lineWidth = 2;
                            ctx.setLineDash([4, 4]);
                            ctx.beginPath(); ctx.arc(m.x, m.targetY, m.radius, 0, Math.PI * 2); ctx.stroke();
                            ctx.setLineDash([]);
                        } else {
                            // 落地爆炸效果
                            const t = m.landedLife / 0.4;
                            const r = m.radius * (1.5 - t * 0.5);
                            ctx.fillStyle = `rgba(255, 100, 0, ${t * 0.5})`;
                            ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = `rgba(255, 200, 50, ${t * 0.7})`;
                            ctx.beginPath(); ctx.arc(m.x, m.y, r * 0.5, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                }
                for (const w of player.weapons) {
                    if (w.type === 'shadow_spirit') {
                        for (let s = 0; s < w.spiritCount; s++) {
                            const st = w.spiritStates && w.spiritStates[s] ? w.spiritStates[s] : { x: player.x, y: player.y };
                            // 锁定引导线：锁定中由淡渐实
                            if (st.target && st.target.alive) {
                                const prog = Math.min(1, st.lockTimer / Math.max(0.1, 1.0 - (w.lockReduction || 0)));
                                const la = 0.25 + prog * 0.65;
                                ctx.strokeStyle = `rgba(176, 106, 255, ${la})`;
                                ctx.lineWidth = 1.5;
                                ctx.setLineDash(prog >= 1 ? [] : [4, 5]);
                                ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(st.target.x, st.target.y); ctx.stroke();
                                ctx.setLineDash([]);
                                // 锁定读条环
                                ctx.strokeStyle = `rgba(230, 190, 255, ${0.5 + prog * 0.5})`;
                                ctx.lineWidth = 2;
                                ctx.beginPath(); ctx.arc(st.x, st.y, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog); ctx.stroke();
                            }
                            const glow = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, 12);
                            glow.addColorStop(0, 'rgba(200, 150, 255, 0.9)');
                            glow.addColorStop(0.5, 'rgba(150, 80, 255, 0.5)');
                            glow.addColorStop(1, 'rgba(100, 0, 200, 0)');
                            ctx.fillStyle = glow;
                            ctx.beginPath(); ctx.arc(st.x, st.y, 12, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = '#e0c0ff';
                            ctx.beginPath(); ctx.arc(st.x, st.y, 4, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                }
                if (game.chainLightningVisuals) {
                    for (const v of game.chainLightningVisuals) {
                        const alpha = Math.min(1, v.life / 0.2);
                        ctx.strokeStyle = `rgba(255, 255, 100, ${alpha})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        const dx = v.x2 - v.x1, dy = v.y2 - v.y1;
                        const len = Math.hypot(dx, dy);
                        const segs = Math.max(3, Math.floor(len / 20));
                        ctx.moveTo(v.x1, v.y1);
                        for (let i = 1; i < segs; i++) {
                            const t = i / segs;
                            const mx = v.x1 + dx * t + (Math.random() - 0.5) * 16;
                            const my = v.y1 + dy * t + (Math.random() - 0.5) * 16;
                            ctx.lineTo(mx, my);
                        }
                        ctx.lineTo(v.x2, v.y2);
                        ctx.stroke();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(v.x1, v.y1);
                        for (let i = 1; i < segs; i++) {
                            const t = i / segs;
                            const mx = v.x1 + dx * t + (Math.random() - 0.5) * 8;
                            const my = v.y1 + dy * t + (Math.random() - 0.5) * 8;
                            ctx.lineTo(mx, my);
                        }
                        ctx.lineTo(v.x2, v.y2);
                        ctx.stroke();
                    }
                }
            }

            function spawnEnemy() {
                if (game.enemies.length >= MAX_ENEMIES) { game.spawnTimer = 1; return; }
                const side = randInt(0, 3);
                let x, y; const margin = 30;
                if (side === 0) { x = rand(-margin, W + margin); y = -margin; }
                else if (side === 1) { x = W + margin; y = rand(-margin, H + margin); }
                else if (side === 2) { x = rand(-margin, W + margin); y = H + margin; }
                else { x = -margin; y = rand(-margin, H + margin); }
                let typeKey = 'zombie';
                const t = game.time;
                if (t > 20 && Math.random() < 0.25) typeKey = 'runner';
                if (t > 40 && Math.random() < 0.2) typeKey = 'brute';
                if (t > 35 && Math.random() < 0.18) typeKey = 'wraith';
                if (t > 45 && Math.random() < 0.20) typeKey = 'pyromancer';
                if (t > 80 && Math.random() < 0.3) typeKey = 'runner';
                if (t > 100 && Math.random() < 0.15) typeKey = 'brute';
                const diffBonus = game.difficultyLevel - 1;
                game.enemies.push(new Enemy(x, y, typeKey, diffBonus));
            }

            function spawnBoss() {
                if (game.bossOnField) return;
                if (game.enemies.length >= MAX_ENEMIES) { game.bossTimer = 10; return; }
                const side = randInt(0, 3);
                let x, y; const margin = 40;
                if (side === 0) { x = rand(margin, W - margin); y = -margin; }
                else if (side === 1) { x = W + margin; y = rand(margin, H - margin); }
                else if (side === 2) { x = rand(margin, W - margin); y = H + margin; }
                else { x = -margin; y = rand(margin, H - margin); }
                game.bossAppearedCount++;
                const diffBonus = game.difficultyLevel - 1;
                const bossTypes = ['boss', 'broodmother', 'assassin'];
                const bossType = bossTypes[Math.floor(Math.random() * bossTypes.length)];
                const boss = new Enemy(x, y, bossType, diffBonus);
                game.enemies.push(boss);
                game.bossOnField = true;
                game.warningText = ENEMY_TYPES[bossType].name + ' 降临！';
                game.warningTimer = 2.0;
                sound.play('bossWarn');
                triggerShake(8, 0.5);
                spawnParticles(x, y, 30, '#ff0000', 80, 0.8, 5);
            }

            function update(dt) {
                if (game.state === 'gameover') return;
                const cappedDt = Math.min(dt, 0.1);
                if (game.state === 'playing') {
                    const player = game.player;
                    player.update(cappedDt);
                    updateWeapons(player, cappedDt);
                    // 更新火焰区域
                    if (game.fireZones) {
                        for (let i = game.fireZones.length - 1; i >= 0; i--) {
                            const zone = game.fireZones[i];
                            zone.remaining -= cappedDt;
                            if (zone.remaining <= 0) {
                                game.fireZones.splice(i, 1);
                                continue;
                            }
                            zone.tickTimer = (zone.tickTimer || 0) + cappedDt;
                            if (zone.tickTimer >= (zone.tickRate || 0.5)) {
                                zone.tickTimer -= (zone.tickRate || 0.5);
                                if (dist(player, zone) < zone.radius + player.size) {
                                    player.takeDamage(zone.damage);
                                }
                            }
                        }
                    }
                    // 更新星落燃烧区域
                    if (game.burningZones) {
                        for (let i = game.burningZones.length - 1; i >= 0; i--) {
                            const zone = game.burningZones[i];
                            zone.remaining -= cappedDt;
                            if (zone.remaining <= 0) { game.burningZones.splice(i, 1); continue; }
                            zone.tickTimer = (zone.tickTimer || 0) + cappedDt;
                            const tickRate = zone.tickRate || 0.5;
                            if (zone.tickTimer >= tickRate) {
                                zone.tickTimer -= tickRate;
                                for (const e of game.enemies) {
                                    if (!e.alive) continue;
                                    if (Math.hypot(e.x - zone.x, e.y - zone.y) < zone.radius) {
                                        e.takeDamage(zone.damage, 'fire');
                                    }
                                }
                            }
                        }
                    }
                    // 更新暗影刺客残影：减速区域 + 回音剑气
                    if (game.shadowZones) {
                        for (let i = game.shadowZones.length - 1; i >= 0; i--) {
                            const sz = game.shadowZones[i];
                            sz.remaining -= cappedDt;
                            if (sz.remaining <= 0) { game.shadowZones.splice(i, 1); continue; }
                            // 回音剑气：0.3s 后朝玩家发射一次扇形三连（30%伤害），只发射一次
                            if (!sz.echoFired) {
                                sz.echoTimer -= cappedDt;
                                if (sz.echoTimer <= 0) {
                                    sz.echoFired = true;
                                    const base = Math.atan2(player.y - sz.y, player.x - sz.x);
                                    const spread = 0.25;
                                    for (let k = -1; k <= 1; k++) {
                                        const a = base + spread * k;
                                        const pj = new Projectile(sz.x, sz.y, Math.cos(a) * sz.echoSpeed, Math.sin(a) * sz.echoSpeed, sz.echoDamage, 0, 0, '#b06aff', 12, true);
                                        pj.ignoreIFrame = true;
                                        game.projectiles.push(pj);
                                    }
                                }
                            }
                            // 减速区域：玩家进入减速 30%
                            if (Math.hypot(player.x - sz.x, player.y - sz.y) < 90 + player.size) {
                                player.slowTimer = 0.15;
                                player.slowAmount = 0.3;
                            }
                        }
                    }
                    // 更新暗影刺客瞬移拖影
                    if (game.shadowTrails) {
                        for (let i = game.shadowTrails.length - 1; i >= 0; i--) {
                            const tr = game.shadowTrails[i];
                            tr.life -= cappedDt;
                            if (tr.life <= 0) game.shadowTrails.splice(i, 1);
                        }
                    }
                    // 更新陨石下落动画
                    if (game.meteorVisuals) {
                        for (let i = game.meteorVisuals.length - 1; i >= 0; i--) {
                            const m = game.meteorVisuals[i];
                            if (!m.landed) {
                                m.y += m.fallSpeed * cappedDt;
                                if (m.y >= m.targetY) {
                                    m.y = m.targetY;
                                    m.landed = true;
                                    m.landedLife = 0.4;
                                    sound.play('meteor');
                                    for (const e of game.enemies) {
                                        if (!e.alive) continue;
                                        if (Math.hypot(e.x - m.x, e.y - m.y) < m.radius) {
                                            e.takeDamage(m.damage, 'meteor');
                                        }
                                    }
                                    spawnParticles(m.x, m.y, 20, '#ff6600', 80, 0.6, 5);
                                    triggerShake(4, 0.2);
                                    if (m.leaveBurning) {
                                        game.burningZones.push({ 
                                            x: m.x, y: m.y, radius: m.radius * 0.6, 
                                            damage: m.damage * m.burningDamagePercent, 
                                            remaining: m.burningDuration,
                                            tickRate: m.burningTickRate,
                                            tickTimer: 0
                                        });
                                    }
                                }
                            } else {
                                m.landedLife -= cappedDt;
                                if (m.landedLife <= 0) game.meteorVisuals.splice(i, 1);
                            }
                        }
                    }
                    // 更新闪电链视觉效果
                    if (game.chainLightningVisuals) {
                        for (let i = game.chainLightningVisuals.length - 1; i >= 0; i--) {
                            game.chainLightningVisuals[i].life -= cappedDt;
                            if (game.chainLightningVisuals[i].life <= 0) game.chainLightningVisuals.splice(i, 1);
                        }
                    }
                    for (const proj of game.projectiles) {
                        proj.update(cappedDt);
                        // 酸弹落地：生成毒池
                        if (!proj.alive && proj.acid && !proj.acidPooled) {
                            proj.acidPooled = true;
                            spawnParticles(proj.x, proj.y, 8, '#66ff44', 60, 0.4, 3);
                            if (game.fireZones.length >= 40) game.fireZones.shift();
                            game.fireZones.push({ x: proj.x, y: proj.y, radius: proj.poolRadius || 75, damage: proj.poolDamage || 10, remaining: 4, tickRate: 0.4, tickTimer: 0, rgb: '120,255,80' });
                        }
                        if (!proj.alive) continue;
                        if (proj.isEnemy) {
                            if (dist(proj, player) < proj.size + player.size) {
                                player.takeDamage(proj.damage, 'default', proj.ignoreIFrame === true);
                                proj.alive = false;
                                spawnParticles(proj.x, proj.y, 4, '#ff0000', 40, 0.2, 3);
                            }
                        } else {
                            for (const enemy of game.enemies) {
                                if (!enemy.alive) continue;
                                if (dist(proj, enemy) < proj.size + enemy.size) {
                                    enemy.takeDamage(proj.damage, 'projectile');
                                    sound.play('hit');
                                    if (proj.knockback) {
                                        const kd = Math.hypot(enemy.x - proj.x, enemy.y - proj.y) || 1;
                                        enemy.x = clamp(enemy.x + (enemy.x - proj.x) / kd * proj.knockback, enemy.size, W - enemy.size);
                                        enemy.y = clamp(enemy.y + (enemy.y - proj.y) / kd * proj.knockback, enemy.size, H - enemy.size);
                                    }
                                    if (proj.shadowSlow && proj.slowChance > 0 && Math.random() < proj.slowChance) {
                                        enemy.applySlow(proj.slowAmount, proj.slowDuration);
                                    }
                                    if (proj.splashRadius > 0) {
                                        const splashDmg = proj.damage * proj.splashDamagePercent;
                                        for (const other of game.enemies) {
                                            if (!other.alive || other === enemy) continue;
                                            if (dist(proj, other) < proj.splashRadius) other.takeDamage(splashDmg, 'projectile');
                                        }
                                    }
                                    proj.alive = false;
                                    spawnParticles(proj.x, proj.y, 4, proj.color, 50, 0.2, 2.5);
                                    break;
                                }
                            }
                        }
                    }
                    game.projectiles = game.projectiles.filter(p => p.alive);
                    for (const enemy of game.enemies) if (enemy.alive) enemy.update(cappedDt, player);
                    game.enemies = game.enemies.filter(e => e.alive);
                    const pickupR = player.getEffectivePickupRange();
                    for (const orb of game.experienceOrbs) {
                        if (dist(player, orb) < pickupR) {
                            const angle = Math.atan2(player.y - orb.y, player.x - orb.x);
                            orb.x += Math.cos(angle) * 400 * cappedDt;
                            orb.y += Math.sin(angle) * 400 * cappedDt;
                        }
                        if (dist(player, orb) < player.size + 6) { orb.collected = true; player.addXp(Math.floor(orb.value * (player.expMultiplier || 1))); spawnParticles(orb.x, orb.y, 3, '#ffd700', 30, 0.25, 2); }
                    }
                    game.experienceOrbs = game.experienceOrbs.filter(o => !o.collected && o.life > 0);
                    for (const orb of game.experienceOrbs) orb.life -= cappedDt;
                    game.spawnTimer -= cappedDt;
                    if (game.spawnTimer <= 0) { game.spawnTimer = game.spawnInterval; spawnEnemy(); }
                    if (!game.bossOnField) {
                        game.bossTimer -= cappedDt;
                        if (game.bossTimer <= 0) { spawnBoss(); game.bossTimer = (DIFFICULTIES[game.selectedDifficulty] || DIFFICULTIES.normal).bossRespawn; }
                    }
                    if (game.warningTimer > 0) game.warningTimer -= cappedDt;
                    const newDiff = Math.floor(game.time / 25) + 1;
                    if (newDiff > game.difficultyLevel) {
                        game.difficultyLevel = newDiff;
                        // 出怪频率：按难度预设的初始间隔 / 每级降低量 / 下限收紧
                        const diffNow = DIFFICULTIES[game.selectedDifficulty] || DIFFICULTIES.normal;
                        game.spawnInterval = Math.max(diffNow.spawnMin, diffNow.spawnInterval - (newDiff - diffNow.diffStart) * diffNow.spawnStep);
                    }
                    for (const p of particles) p.update(cappedDt); particles = particles.filter(p => p.alive);
                    for (const dn of damageNumbers) dn.update(cappedDt); damageNumbers = damageNumbers.filter(dn => dn.alive);
                    if (screenShake.elapsed < screenShake.duration) screenShake.elapsed += cappedDt;
                    game.time += cappedDt;
                } else if (game.state === 'levelup' || game.state === 'bossdrop') {
                    for (const p of particles) p.update(cappedDt); particles = particles.filter(p => p.alive);
                    for (const dn of damageNumbers) dn.update(cappedDt); damageNumbers = damageNumbers.filter(dn => dn.alive);
                    if (screenShake.elapsed < screenShake.duration) screenShake.elapsed += cappedDt;
                }
            }

            function draw(ctx) {
                ctx.clearRect(0, 0, W, H);
                const shake = getShakeOffset();
                ctx.save(); ctx.translate(shake.x, shake.y);
                ctx.fillStyle = '#2b160c'; ctx.fillRect(-10, -10, W + 20, H + 20);
                ctx.strokeStyle = 'rgba(255,180,120,0.05)'; ctx.lineWidth = 1;
                for (let gx = 40; gx < W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
                for (let gy = 40; gy < H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
                for (const orb of game.experienceOrbs) {
                    const floatY = Math.sin(game.time * 3 + orb.floatOffset) * 3;
                    const alpha = orb.life < 3 ? orb.life / 3 : 1;
                    ctx.fillStyle = `rgba(255,215,0,${alpha})`; ctx.beginPath(); ctx.arc(orb.x, orb.y + floatY, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = `rgba(255,255,200,${alpha*0.8})`; ctx.beginPath(); ctx.arc(orb.x, orb.y + floatY, 2.5, 0, Math.PI * 2); ctx.fill();
                }
                for (const proj of game.projectiles) proj.draw(ctx);
                for (const enemy of game.enemies) enemy.draw(ctx);
                if (game.player) game.player.draw(ctx);
                if (game.player) drawWeaponsVisuals(game.player, ctx);
                for (const p of particles) p.draw(ctx);
                for (const dn of damageNumbers) dn.draw(ctx);
                ctx.restore();
                if (game.state === 'levelup' || game.bossDropChoices) {
                    ctx.fillStyle = 'rgba(43,26,18,0.4)'; ctx.fillRect(0, 0, W, H);
                }
                updateHud();
            }

            function updateHud() {
                const inGame = game.state !== 'menu';
                hudTop.style.display = inGame ? 'flex' : 'none';
                hudWeps.style.display = inGame ? 'flex' : 'none';
                hudWarning.style.display = 'none';
                hudHint.style.display = 'none';
                pauseOverlay.style.display = 'none';
                btnPause.style.display = inGame ? '' : 'none';
                if (!inGame) return;
                const player = game.player;
                if (player) {
                    const hpRatio = clamp(player.hp / player.maxHp, 0, 1);
                    hudHpFill.style.width = (hpRatio * 100) + '%';
                    hudHpText.textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
                    const xpRatio = clamp(player.xp / player.xpToNext, 0, 1);
                    hudXpFill.style.width = (xpRatio * 100) + '%';
                    hudXpText.textContent = `Lv.${player.level}`;
                    let weps = '';
                    for (const w of player.weapons) {
                        if (w.type === 'magic_missile') weps += '<span class="chip">' + ICONS.flame + '火球</span>';
                        else if (w.type === 'orbit_blade') weps += '<span class="chip">' + ICONS.swords + '飞刃×' + w.bladeCount + '</span>';
                        else if (w.type === 'frost_nova') weps += '<span class="chip">' + ICONS.snowflake + '冰霜</span>';
                        else if (w.type === 'lightning_chain') weps += '<span class="chip">' + ICONS.zap + '闪电</span>';
                        else if (w.type === 'meteor') weps += '<span class="chip">' + ICONS.orbit + '陨石</span>';
                        else if (w.type === 'shadow_spirit') weps += '<span class="chip">' + ICONS.ghost + '精灵×' + w.spiritCount + '</span>';
                    }
                    hudWeps.innerHTML = weps ? '武器：' + weps : '';
                }
                hudTime.textContent = Math.floor(game.time) + 's';
                hudKills.textContent = game.kills;
                const boss = game.enemies.find(e => e.isBoss && e.alive);
                if (boss) {
                    hudBoss.style.display = 'flex';
                    hudBossName.textContent = ENEMY_TYPES[boss.typeKey].name;
                    hudBossFill.style.width = (clamp(boss.hp / boss.maxHp, 0, 1) * 100) + '%';
                    if (boss.invincible && boss.shieldHp > 0) {
                        hudShield.style.display = 'block';
                        hudShield.style.width = (clamp(boss.shieldHp / boss.shieldMax, 0, 1) * 100) + '%';
                    } else {
                        hudShield.style.display = 'none';
                    }
                } else if (hudBoss.style.display !== 'none') {
                    hudBoss.style.display = 'none';
                }
                if (game.warningTimer > 0) {
                    hudWarning.textContent = game.warningText;
                    hudWarning.style.opacity = (0.9 * Math.min(1, game.warningTimer)).toFixed(2);
                    hudWarning.style.display = 'block';
                } else if (hudWarning.style.display !== 'none') {
                    hudWarning.style.display = 'none';
                }
                if (game.time < 4 && game.state === 'playing') {
                    hudHint.textContent = useTouchControl ? '滑动屏幕移动角色' : 'WASD 移动 · 自动攻击 · 击杀升级';
                    hudHint.style.display = 'block';
                } else if (hudHint.style.display !== 'none') {
                    hudHint.style.display = 'none';
                }
                pauseOverlay.style.display = paused ? 'flex' : 'none';
            }

            let lastTime = performance.now(), accumulator = 0;
            const fixedDt = 1 / 60;
            document.addEventListener('visibilitychange', () => { lastTime = performance.now(); accumulator = 0; });
            function gameLoop(timestamp) {
                let rawDt = (timestamp - lastTime) / 1000; lastTime = timestamp;
                if (rawDt > 0.2) rawDt = 0.2;
                if (!paused) {
                    accumulator += rawDt;
                    while (accumulator >= fixedDt) { update(fixedDt); accumulator -= fixedDt; }
                }
                resizeCanvas();
                if (game.player) { game.player.x = clamp(game.player.x, game.player.size, W - game.player.size); game.player.y = clamp(game.player.y, game.player.size, H - game.player.size); }
                draw(ctx);
                requestAnimationFrame(gameLoop);
            }

            restartBtn.addEventListener('click', () => { initGame(); lastTime = performance.now(); accumulator = 0; });
            gameoverOverlay.addEventListener('click', (e) => { if (e.target === gameoverOverlay) { initGame(); lastTime = performance.now(); accumulator = 0; } });

            function renderMenu() {
                menuDiffs.innerHTML = '';
                for (const [key, d] of Object.entries(DIFFICULTIES)) {
                    const b = document.createElement('button');
                    b.textContent = d.name;
                    b.classList.toggle('active', game.selectedDifficulty === key);
                    b.addEventListener('click', () => { game.selectedDifficulty = key; renderMenu(); });
                    menuDiffs.appendChild(b);
                }
                menuWeapons.innerHTML = '';
                for (const [key, m] of Object.entries(START_WEAPON_META)) {
                    const b = document.createElement('button');
                    b.innerHTML = `<span class="w-ico">${ICONS[m.icon] || ''}</span>${m.name}`;
                    b.classList.toggle('active', game.selectedWeapon === key);
                    b.addEventListener('click', () => { game.selectedWeapon = key; renderMenu(); });
                    menuWeapons.appendChild(b);
                }
                const bt = parseInt(localStorage.getItem('rogue_best_time') || '0', 10);
                const bk = parseInt(localStorage.getItem('rogue_best_kills') || '0', 10);
                menuBest.textContent = (bt > 0 || bk > 0) ? `最佳记录：存活 ${bt} 秒 · ${bk} 击杀` : '尚无最佳记录，开启你的第一局吧！';
            }
            function showMenu() {
                renderMenu();
                paused = false;
                menuOverlay.style.display = 'flex';
                game.state = 'menu';
            }
            menuStart.addEventListener('click', () => {
                menuOverlay.style.display = 'none';
                initGame();
                lastTime = performance.now(); accumulator = 0;
            });
            menuBtn.addEventListener('click', () => {
                gameoverOverlay.style.display = 'none';
                showMenu();
            });

            initIcons();
            lastTime = performance.now(); requestAnimationFrame(gameLoop);
            showMenu();
            console.log('魔法幸存者 · 怪物增强版 已启动');
        })();
    </script>
</body>
</html>
